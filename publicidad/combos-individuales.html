<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Hojas de combos · Villa Real</title>
<style>
  /* Open Sans (OFL, en fuentes/): las letras del diseño que eligió el dueño. */
  @font-face { font-family: "Open Sans"; src: url("fuentes/OpenSans.ttf"); font-weight: 300 800; font-stretch: 75% 100%; font-style: normal; }
  @font-face { font-family: "Open Sans"; src: url("fuentes/OpenSans-Italic.ttf"); font-weight: 300 800; font-stretch: 75% 100%; font-style: italic; }
  /* Kaushan Script (OFL, en fuentes/): la letra de mano de la frase del navideño y del pizzero. */
  @font-face { font-family: "Kaushan Script"; src: url("fuentes/KaushanScript-Regular.ttf"); }

  /* Cada combo en su propia hoja, tamaño carta (216 × 279 mm), para imprimir y plastificar una a una.
     Todo va en milímetros, al tamaño real. generar.mjs saca cada hoja en PDF y en JPG a 300 ppp.
     El diseño es el de la imagen que trajo el dueño (fondos/referencia-dueno.png), con las fotos de verdad de cada producto. */
  @page { size: 216mm 279mm; margin: 0; }
  html, body { margin: 0; background: #888; }
  body { font-family: "Open Sans", Arial, sans-serif; display: grid; gap: 20mm; padding: 20mm; justify-content: start; }

  .hoja {
    --rojo: #a80d14; --rojo-oscuro: #7c0a10; --oro: #f2c14e; --crema: #fff6e3; --tinta: #2a1a14;
    /* La escala de los productos: lo que mide un centímetro real en la hoja. */
    --mm-por-cm: 3;
    position: relative; width: 216mm; height: 279mm; overflow: hidden; background: #f6e5c2;
  }

  /* El fondo: los estantes desenfocados detrás y el mostrador de madera delante. */
  .estante { position: absolute; left: 0; top: 34mm; width: 216mm; height: 102mm; object-fit: cover; display: block; }
  .madera { position: absolute; left: 0; top: 134mm; width: 216mm; height: 145mm; object-fit: cover; display: block; }
  .luz { position: absolute; left: 0; top: 134mm; width: 216mm; height: 145mm; background: radial-gradient(ellipse 62% 60% at 50% 55%, rgba(255, 251, 238, 0.75), rgba(255, 251, 238, 0)); }
  .canto { position: absolute; left: 0; top: 133.4mm; width: 216mm; height: 2.2mm; background: linear-gradient(180deg, rgba(120, 80, 30, 0.28), rgba(120, 80, 30, 0)); }

  .capa { position: absolute; left: 0; top: 0; width: 216mm; height: 279mm; display: block; }
  .capa--arte { z-index: 2; }
  .capa--sello { z-index: 6; }

  /* La cabecera: el león, la raya, el nombre. */
  .leon { position: absolute; left: 8mm; top: 4.5mm; width: 27mm; height: 38.7mm; display: block; z-index: 6; }
  .raya { position: absolute; left: 40.4mm; top: 8mm; width: 0.6mm; height: 32mm; background: var(--oro); z-index: 6; }
  .charcuteria { position: absolute; left: 47.5mm; top: 5.6mm; font-weight: 800; font-size: 9.6mm; line-height: 1; letter-spacing: 0.035em; color: var(--oro); z-index: 6; white-space: nowrap; }
  .nombre { position: absolute; left: 46.5mm; top: 13.2mm; font-weight: 800; font-size: 23.5mm; line-height: 1; letter-spacing: -0.015em; color: var(--crema); z-index: 6; white-space: nowrap; }

  /* Los productos, de verdad: a la misma escala, derechos, apoyados en el mostrador y un poco solapados, el más pequeño delante. */
  .productos { position: absolute; left: 4mm; right: 4mm; top: 0; height: 158mm; display: flex; justify-content: center; align-items: flex-end; z-index: 4; }
  .pieza { position: relative; display: block; flex: none; z-index: calc(100 - var(--cm, 30)); }
  .pieza img { display: block; height: calc(var(--cm, 30) * var(--mm-por-cm) * 1mm); width: auto; }
  .pieza::after {
    content: ""; position: absolute; left: -7%; right: -7%; bottom: -2.4mm; height: 6mm; z-index: -1;
    background: radial-gradient(ellipse 50% 50% at 50% 50%, rgba(70, 35, 10, 0.55), rgba(70, 35, 10, 0));
  }
  .pieza + .pieza { margin-left: -10mm; }
  /* Los adornos de los especiales, dibujados encima de la foto de cada producto. */
  .adorno { position: absolute; display: block; overflow: visible; pointer-events: none; filter: drop-shadow(0 0.6mm 0.9mm rgba(40, 10, 0, 0.35)); }
  .adorno--gorro { left: 2%; top: -27%; width: 96%; transform: rotate(-9deg); }
  .adorno--moño { left: -12%; top: -6%; width: 64%; transform: rotate(-16deg); }
  .adorno--acebo { right: 0; top: -9%; width: 52%; transform: rotate(12deg); }
  .adorno--perro { left: -4%; top: -15%; width: 108%; transform: rotate(-7deg); }
  .adorno--salsas { right: -4%; top: -66%; width: 50%; }
  .adorno--chorro { left: -4%; top: -3%; width: 112%; transform: rotate(-5deg); }
  .adorno--corazon { left: 3%; top: 1%; width: 36%; transform: rotate(-14deg); }
  .adorno--corazones { left: 30%; top: -50%; width: 46%; }
  .adorno--escarapela { right: -21%; bottom: 1%; width: 54%; transform: rotate(9deg); }
  .adorno--cortapizza { left: -14%; top: -12%; width: 74%; transform: rotate(-28deg); }
  .adorno--cocinero { left: 4%; top: -32%; width: 92%; transform: rotate(-6deg); }
  .adorno--porcion { right: -8%; top: -27%; width: 60%; transform: rotate(24deg); }
  .adorno--sandwich { right: -30%; top: -21%; width: 76%; transform: rotate(10deg); }
  .hoja--separado .pieza + .pieza { margin-left: 3mm; }
  .hoja--tres .pieza + .pieza { margin-left: -7mm; }

  /* Lo que lleva: el nombre, el peso, la frase y la casilla del precio. */
  .contenido { position: absolute; left: 10mm; right: 10mm; top: 159.6mm; bottom: 13mm; display: flex; flex-direction: column; justify-content: space-between; gap: 3mm; z-index: 5; }
  .titulo { text-align: center; }
  .linea {
    display: block; font-weight: 800; font-size: 16.5mm; line-height: 1.02; letter-spacing: -0.012em; text-transform: uppercase; white-space: nowrap;
    color: var(--rojo-oscuro); -webkit-text-stroke: 1.2mm #ffffff; paint-order: stroke fill;
  }
  /* Los combos con nombre propio (perrero, solidario, navideño, pizzero): la misma hoja, con el título en una placa roja y dorada. */
  .hoja--especial .titulo { box-sizing: border-box; padding: 1.1mm 4mm 1.5mm; border: 0.8mm solid #e7b33f; border-radius: 4mm; background: linear-gradient(180deg, #bb1119, #8a090f); }
  .hoja--especial .linea { font-size: 18mm; line-height: 1.04; color: var(--crema); -webkit-text-stroke: 0; }
  .etiqueta { display: flex; align-items: center; justify-content: center; gap: 3mm; color: var(--oro); font-weight: 800; font-size: 6mm; line-height: 1.15; letter-spacing: 0.14em; text-transform: uppercase; }
  .etiqueta::before, .etiqueta::after { content: ""; width: 30mm; height: 0.5mm; background: #e7b33f; }

  .fila-pildora { display: flex; align-items: center; }
  .fila-pildora::before, .fila-pildora::after { content: ""; flex: 1; min-width: 3mm; height: 0.7mm; background: #c98f1e; }
  .pildora {
    box-sizing: border-box; padding: 1.4mm 10mm; border-radius: 3mm; border: 0.35mm solid #a8740f; text-align: center;
    background: linear-gradient(180deg, #f9dd86 0%, #edbb49 55%, #cf961f 100%); color: #5e0a0c; font-weight: 800; font-size: 10mm; line-height: 1.2;
  }
  .pildora--media { font-size: 8.2mm; padding: 1.4mm 7mm; text-wrap: balance; }
  .pildora--larga { font-size: 7.2mm; line-height: 1.15; padding: 1.2mm 7mm; text-wrap: balance; }

  .frase { text-align: center; font-style: italic; font-weight: 600; font-size: 9.6mm; line-height: 1.15; color: var(--tinta); }
  .subrayado { position: relative; display: inline-block; }
  .subrayado svg { position: absolute; left: -2%; width: 104%; bottom: -1.3mm; height: 2.6mm; display: block; }

  /* La casilla del precio, en dólares, va en blanco: se escribe con marcador sobre el plástico al lado del «$».
     Una etiqueta pequeña abajo a la derecha, como las de precio de un supermercado: la que eligió el dueño entre cuatro
     tamaños. Su tamaño y su sitio (center, flex-end) van en las tres variables de .hoja. */
  .hoja { --precio-ancho: 64mm; --precio-alto: 26mm; --precio-lado: flex-end; }
  .precio {
    flex: none; align-self: var(--precio-lado); width: var(--precio-ancho); height: var(--precio-alto); box-sizing: border-box; display: flex; align-items: center;
    padding: 0 calc(var(--precio-alto) * 0.22); border: 1.4mm solid var(--rojo); border-radius: calc(var(--precio-alto) * 0.26); background: #fff9ec; box-shadow: inset 0 0 0 0.5mm #f0d9a8;
  }
  .precio span { font-weight: 800; font-size: calc(var(--precio-alto) * 0.56); line-height: 1; color: var(--rojo-oscuro); }

  /* El navideño y el pizzero, con el estilo de las imágenes que trajo el dueño (fondos/referencia-navidad.png y
     fondos/referencia-pizza.jpg): la cabecera en una placa verde con borde dorado sobre luces desenfocadas, la mitad de
     abajo roja con rayos de luz, el título con estrellas, la frase en letra de mano y la casilla del precio con su marco
     dorado; en las esquinas, ramas de pino con bolas, o tomates y albahaca. Los productos siguen siendo las fotos de verdad. */
  .hoja--festiva { background: #2b1408; }
  .hoja--festiva .estante { top: 0; height: 140mm; filter: brightness(0.6) saturate(1.3) sepia(0.25); }
  .hoja--festiva .madera { filter: sepia(0.45) saturate(1.5) brightness(0.88); }
  .hoja--festiva .nombre { color: #ffffff; text-shadow: 0 0.7mm 0 #06301a, 0 1.3mm 1.6mm rgba(0, 0, 0, 0.5); }
  .hoja--festiva .charcuteria { text-shadow: 0 0.5mm 0.8mm rgba(0, 0, 0, 0.45); }
  .capa--encima { z-index: 7; }
  .hoja--festiva .titulo {
    position: relative; padding: 0 14mm 1.8mm; border: 1mm solid #f0c24f; border-radius: 6mm;
    background: linear-gradient(180deg, #d81c24 0%, #a50d14 55%, #77070c 100%);
    box-shadow: 0 0 0 0.5mm #8a5a08, 0 1.6mm 2.6mm rgba(50, 8, 0, 0.5), inset 0 0.9mm 0 rgba(255, 255, 255, 0.22);
  }
  .hoja--festiva .linea { font-size: 16.5mm; color: #ffffff; text-shadow: 0 0.8mm 0 #7c0a10, 0 1.5mm 1.8mm rgba(0, 0, 0, 0.4); }
  .hoja--festiva .etiqueta {
    width: fit-content; margin: -5.2mm auto 0.2mm; padding: 0.5mm 7mm 0.7mm; border: 0.8mm solid #f0c24f; border-radius: 99mm;
    background: linear-gradient(180deg, #c8161e, #7f0a10); box-shadow: 0 0.6mm 1.2mm rgba(50, 8, 0, 0.45);
    font-size: 6.4mm; letter-spacing: 0.06em; color: #f8d466;
  }
  .hoja--festiva .etiqueta::before, .hoja--festiva .etiqueta::after { display: none; }
  .estrella { position: absolute; bottom: 5.4mm; width: 8.5mm; height: 8.5mm; display: block; filter: drop-shadow(0 0.5mm 0.6mm rgba(60, 10, 0, 0.5)); }
  .estrella--izquierda { left: 3.2mm; }
  .estrella--derecha { right: 3.2mm; }
  .hoja--festiva .pildora { border-radius: 5mm; box-shadow: 0 1.2mm 2mm rgba(50, 8, 0, 0.45), inset 0 0.7mm 0 rgba(255, 255, 255, 0.45); }
  .hoja--festiva .frase {
    display: flex; align-items: center; justify-content: center; gap: 3mm;
    font-family: "Kaushan Script", "Open Sans", cursive; font-style: normal; font-weight: 400; font-size: 12.5mm; line-height: 1.05;
    color: #ffffff; text-shadow: 0 0.7mm 0 #6a060b, 0 1.2mm 2mm rgba(0, 0, 0, 0.45);
  }
  .rayos { flex: none; width: 10mm; height: 9mm; display: block; }
  .hoja--festiva .precio { border-color: #c3161d; box-shadow: 0 0 0 1mm #f0c24f, 0 0 0 1.4mm #8a5a08, 0 2mm 3.2mm rgba(40, 5, 0, 0.5), inset 0 0 0 0.5mm #f0d9a8; }

  /* El solidario, como la imagen que trajo el dueño (fondos/referencia-solidario.jpg): la hoja roja de siempre, sin corazones,
     con el nombre y el título en relieve y unas hojas verdes a los lados de los productos. */
  .hoja--solidario .nombre { color: #ffffff; text-shadow: 0 0.7mm 0 #6a060b, 0 1.3mm 1.6mm rgba(0, 0, 0, 0.4); }
  .hoja--solidario .linea { color: #ffffff; text-shadow: 0 0.8mm 0 #6a060b, 0 1.5mm 1.8mm rgba(0, 0, 0, 0.35); }
  .hoja--solidario .titulo { box-shadow: 0 1.6mm 2.6mm rgba(50, 8, 0, 0.4), inset 0 0.9mm 0 rgba(255, 255, 255, 0.2); }
  .hoja--solidario .pildora { box-shadow: 0 1.2mm 2mm rgba(50, 8, 0, 0.35), inset 0 0.7mm 0 rgba(255, 255, 255, 0.45); }
</style>
</head>
<body>
<script src="combos-datos.js"></script>
<script>
  // Una hoja por combo, con los datos de combos-datos.js. Los dibujos van en milímetros (viewBox de la hoja entera).
  /** Un dibujito de sándwich, muy tenue, como marca de agua sobre la madera. */
  const sandwich = (x, y, escala, giro = 0) => `
    <g transform="translate(${x} ${y}) rotate(${giro}) scale(${escala})" fill="none" stroke="#c8954a" stroke-opacity="0.22" stroke-width="0.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M2 10Q2 2 14 2Q26 2 26 10Z"/><path d="M1 12q2 2 4 0t4 0t4 0t4 0t4 0t4 0t2 0"/><rect x="2" y="14" width="24" height="3" rx="1.5"/><path d="M2 19H26Q26 24 20 24H8Q2 24 2 19Z"/>
      <path d="M9 6l1 .6M14 4.6l1 .6M19 6l1 .6"/>
    </g>`;

  /** Un copo de nieve: tres rayas cruzadas con sus puntas. */
  const copo = (x, y, r) =>
    `<g transform="translate(${x} ${y})" stroke="#ffffff" stroke-opacity=".85" stroke-width="${(r / 6).toFixed(2)}" stroke-linecap="round" fill="none">${[0, 60, 120]
      .map((a) => `<g transform="rotate(${a})"><line x1="0" y1="${-r}" x2="0" y2="${r}"/><path d="M${-r * 0.32},${-r * 0.78}L0,${-r * 0.5}L${r * 0.32},${-r * 0.78}M${-r * 0.32},${r * 0.78}L0,${r * 0.5}L${r * 0.32},${r * 0.78}"/></g>`)
      .join("")}</g>`;
  const COPOS = [[14, 70, 4.2], [36, 98, 3], [58, 64, 2.4], [150, 66, 3.4], [178, 98, 4.4], [202, 70, 3], [24, 128, 3.2], [196, 128, 3.6], [100, 62, 2], [128, 92, 2.6], [8, 100, 2.4], [206, 104, 2.2]];

  /** Un perro caliente a trazo blanco, para el fondo del perrero: el pan, la salchicha y la mostaza. */
  const perrito = (x, y, r, giro) => `
    <g transform="translate(${x} ${y}) rotate(${giro}) scale(${(r / 10).toFixed(3)})" fill="none" stroke="#ffffff" stroke-opacity=".85" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M-8,-1.6C-8,-5.6 -4,-6.6 0,-6.6C4,-6.6 8,-5.6 8,-1.6"/>
      <rect x="-11" y="-2.4" width="22" height="4.8" rx="2.4"/>
      <path d="M-7.5,0q1,-1.6 2,0t2,0t2,0t2,0t2,0t2,0t2,0t2,0" stroke-width="1"/>
      <path d="M-8,2.4C-8,6.2 -4,7.2 0,7.2C4,7.2 8,6.2 8,2.4"/>
    </g>`;

  /** Un corazón para el fondo del solidario: unos blancos y otros rojos, suaves. */
  const corazon = (x, y, r, giro, i) =>
    `<path transform="translate(${x} ${y}) rotate(${giro}) scale(${(r / 9).toFixed(3)})" d="M0,8C-11,0.5 -11,-8.5 -5.2,-8.5C-2.2,-8.5 0,-6.4 0,-4.6C0,-6.4 2.2,-8.5 5.2,-8.5C11,-8.5 11,0.5 0,8Z"
      fill="${i % 3 === 1 ? "#d3151e" : "#ffffff"}" fill-opacity="${i % 3 === 1 ? ".55" : ".85"}"/>`;

  /** Una porción de pizza a trazo blanco, para el fondo del pizzero: el borde, la punta y tres rodajas encima. */
  const pizzita = (x, y, r, giro) => `
    <g transform="translate(${x} ${y}) rotate(${giro}) scale(${(r / 10).toFixed(3)})" fill="none" stroke="#ffffff" stroke-opacity=".85" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M-9,-6Q0,-11 9,-6L0.8,10.4Q0,11.6 -0.8,10.4Z"/>
      <path d="M-10,-9Q0,-14.6 10,-9"/>
      <circle cx="-2.8" cy="-2.6" r="1.7"/><circle cx="2.8" cy="-1.2" r="1.4"/><circle cx="-0.4" cy="3.8" r="1.2"/>
    </g>`;

  /** Una rebanada de pan de molde a trazo blanco, para el fondo del sandwichero: su forma de hongo y la corteza por dentro. */
  const sandwichito = (x, y, r, giro) => `
    <g transform="translate(${x} ${y}) rotate(${giro}) scale(${(r / 10).toFixed(3)})" fill="none" stroke="#ffffff" stroke-opacity=".85" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M-9,-2Q-10.5,-10.5 -3.5,-10.5Q0,-13.5 3.5,-10.5Q10.5,-10.5 9,-2V9Q9,11 7,11H-7Q-9,11 -9,9Z"/>
      <path d="M-6,-1.6Q-7,-7.4 -2.4,-7.4Q0,-9.6 2.4,-7.4Q7,-7.4 6,-1.6V7.4H-6Z" stroke-width=".9" stroke-opacity=".6"/>
    </g>`;

  /** Los dibujitos del fondo de cada especial, en los mismos sitios que los copos, girados para que no parezcan en fila. */
  const GIROS = [-18, 12, -6, 20, -14, 8, 16, -10, 4, -20, 10, -4];
  function fondo(tipo) {
    if (tipo === "copos") return COPOS.map(([x, y, r]) => copo(x, y, r)).join("");
    if (tipo === "perros") return COPOS.map(([x, y, r], i) => perrito(x, y, r * 1.15, GIROS[i])).join("");
    if (tipo === "corazones") return COPOS.map(([x, y, r], i) => corazon(x, y, r, GIROS[i], i)).join("");
    if (tipo === "pizzas") return COPOS.map(([x, y, r], i) => pizzita(x, y, r * 1.1, GIROS[i] * 2)).join("");
    if (tipo === "sandwiches") return COPOS.map(([x, y, r], i) => sandwichito(x, y, r * 1.15, GIROS[i])).join("");
    return "";
  }

  /** Una botella de salsa de las de apretar: el pico, la tapa blanca, el cuerpo con su color y su etiqueta. */
  const botella = (x, giro, id, oscuro, dibujo) => `
    <g transform="rotate(${giro} ${x + 13} 104)">
      <path d="M${x + 10.5},15L${x + 13},2.5L${x + 15.5},15Z" fill="#f4efe6" stroke="#a9a196" stroke-width="1"/>
      <rect x="${x + 6}" y="13" width="14" height="12" rx="2.6" fill="#f4efe6" stroke="#a9a196" stroke-width="1"/>
      <path d="M${x + 2},36Q${x + 2},24 ${x + 8},24H${x + 18}Q${x + 24},24 ${x + 24},36Z" fill="${oscuro}"/>
      <rect x="${x}" y="31" width="26" height="73" rx="8" fill="url(#${id})" stroke="${oscuro}" stroke-width="1.2"/>
      <rect x="${x + 4}" y="54" width="18" height="24" rx="3.5" fill="#fff8e6"/>
      ${dibujo(x + 13, 66)}
      <path d="M${x + 5},38V96" stroke="#ffffff" stroke-opacity=".35" stroke-width="3" stroke-linecap="round"/>
    </g>`;

  /** El sello redondo y ondulado de la escarapela, como el del número del combo. */
  function ondulado(cx, cy, R, picos, hondo) {
    let d = "";
    for (let i = 0; i <= 360; i++) {
      const t = (i / 360) * 2 * Math.PI;
      const r = R * (1 + hondo * Math.cos(picos * t));
      d += `${i ? "L" : "M"}${(cx + r * Math.cos(t)).toFixed(2)},${(cy + r * Math.sin(t)).toFixed(2)}`;
    }
    return `${d}Z`;
  }

  /** Un corazón grande, rojo y con borde dorado. */
  const CORAZON = "M50,86C10,58 4,34 12,20C20,6 40,6 50,22C60,6 80,6 88,20C96,34 90,58 50,86Z";

  /** Los adornos de los especiales. Los colores, los de la hoja: rojo, oro y blanco, con el verde del acebo y de la bandera. */
  const ADORNOS = {
    gorro: `<svg class="adorno adorno--gorro" viewBox="0 0 100 80">
      <defs>
        <linearGradient id="gorroRojo" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ec3a41"/><stop offset=".55" stop-color="#c3161d"/><stop offset="1" stop-color="#7f0a0f"/></linearGradient>
        <radialGradient id="pelusa" cx=".38" cy=".32" r=".75"><stop offset="0" stop-color="#ffffff"/><stop offset=".65" stop-color="#f4f2ee"/><stop offset="1" stop-color="#d6d1ca"/></radialGradient>
      </defs>
      <path d="M12,60C15,36 34,13 62,9C79,7 90,17 93,30C85,25 77,29 75,38C73,46 80,53 90,58Z" fill="url(#gorroRojo)"/>
      <path d="M28,44C38,30 50,20 66,15" fill="none" stroke="#ff8a8a" stroke-opacity=".35" stroke-width="3.5" stroke-linecap="round"/>
      <rect x="3" y="53" width="94" height="19" rx="9.5" fill="url(#pelusa)"/>

    const oroH = `url(#oroH-${n})`;
    return `<svg class="capa capa--arte" viewBox="0 0 216 279" xmlns="http://www.w3.org/2000/svg">

      ${sandwich(3, 138, 1.15)}${sandwich(186, 142, 1.15, 4)}${sandwich(-12, 190, 1.1, -6)}${sandwich(198, 204, 1.1, 8)}${sandwich(-10, 236, 1, 6)}${sandwich(196, 244, 1, -4)}

      <!-- La cabecera -->
      <path d="M0,0H216V49C178,47 146,37.5 100,38C58,38.5 28,47 0,51Z" fill="url(#rojoCabecera-${n})"/>
      <path d="M0,0H216V49C178,47 146,37.5 100,38C58,38.5 28,47 0,51Z" fill="url(#trama-${n})"/>
      <path d="M0,57.5C28,50 58,39.8 100,39.6C146,40 178,51 216,53.5V56C178,53.5 146,42 100,41.6C58,41.8 28,52.5 0,60Z" fill="#3c1400" fill-opacity=".16"/>
      <path d="M0,51C28,47 58,38.5 100,38C146,37.5 178,47 216,49V53.5C178,51 146,40 100,39.6C58,39.8 28,50 0,57.5Z" fill="${oroH}"/>

      <!-- Una franja roja abajo, con su raya dorada, que cierra la hoja como la cabecera -->
      <path d="M0,271.5C60,269.5 156,269.5 216,271.5V279H0Z" fill="url(#rojoCabecera-${n})"/>
      <path d="M0,271.5C60,269.5 156,269.5 216,271.5" fill="none" stroke="${oroH}" stroke-width="1.2"/>
    </svg>`;
  }

  /** El sello dorado con el número del combo. */
  function sello(n, estrellas = false) {
    const cx = 186.4, cy = 27, R = 23.4, PICOS = 26;
    let borde = "";
    for (let i = 0; i <= 720; i++) {
      const t = (i / 720) * 2 * Math.PI;
      const r = R * (1 + 0.026 * Math.cos(PICOS * t));
      borde += `${i ? "L" : "M"}${(cx + r * Math.cos(t)).toFixed(2)},${(cy + r * Math.sin(t)).toFixed(2)}`;
    }
    // Con dos cifras el número va más chico y las rayas de los lados, más cortas y más afuera, para que no lo toquen.
    const dos = n >= 10;
    const desde = dos ? 13.8 : 12.2;
    const rayas = (signo) =>
      [[3.2, 5.4], [6.2, 7], [9.2, 5.4]].map(([dy, largo]) => `<line x1="${cx + signo * desde}" y1="${cy + dy}" x2="${cx + signo * (desde + largo * (dos ? 0.6 : 1))}" y2="${cy + dy}"/>`).join("");
    return `<svg class="capa capa--sello" viewBox="0 0 216 279" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="oroSello-${n}" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#fff1b8"/><stop offset=".35" stop-color="#e8b43f"/><stop offset=".7" stop-color="#b98417"/><stop offset="1" stop-color="#f6d779"/></linearGradient>
        <linearGradient id="oroNumero-${n}" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#fff3b0"/><stop offset=".5" stop-color="#f2c94c"/><stop offset="1" stop-color="#c58a14"/></linearGradient>
        <radialGradient id="rojoSello-${n}" cx=".5" cy=".42" r=".65"><stop offset="0" stop-color="#bd1019"/><stop offset="1" stop-color="#7a070c"/></radialGradient>
      </defs>
      <path d="${borde}Z" fill="url(#oroSello-${n})"/>
      <circle cx="${cx}" cy="${cy}" r="${R - 2.7}" fill="url(#rojoSello-${n})" stroke="#fff1b8" stroke-width=".35"/>
      <text x="${cx}" y="${cy - 9.4}" text-anchor="middle" font-family="Open Sans" font-weight="800" font-size="7.2" fill="#ffffff">COMBO</text>
      <text x="${cx}" y="${cy + (dos ? 12.6 : 15)}" text-anchor="middle" font-family="Open Sans" font-weight="800" font-size="${dos ? 20.5 : 28}" fill="url(#oroNumero-${n})">${n}</text>
      ${
        estrellas
          ? [1, -1].map((signo) => `<path d="${estrella5(cx + signo * (dos ? 16.6 : 14.2), cy + 5.6, dos ? 2.2 : 2.8)}" fill="url(#oroNumero-${n})" stroke="#8a5a08" stroke-width=".25" stroke-linejoin="round"/>`).join("")
          : `<g stroke="#f2c14e" stroke-width=".7" stroke-linecap="round">${rayas(1)}${rayas(-1)}</g>`
      }
    </svg>`;
  }

  /** El peso o lo que lleva, en mayúsculas pero con los gramos y los mililitros como se escriben; un número no se separa de lo que cuenta («6 huevos»). */
  const enMayusculas = (texto) => texto.toUpperCase().replace(/(\d) G\b/g, "$1 g").replace(/(\d) ML\b/g, "$1 ml").replace(/(\d) /g, "$1 ");
  const clasePildora = (texto) => (texto.length <= 22 ? "" : texto.length <= 45 ? " pildora--media" : " pildora--larga");

  /** La frase, con la raya roja a mano debajo de las palabras que se destacan. */
  function frase(combo) {
    const raya = `<svg viewBox="0 0 100 6" preserveAspectRatio="none"><path fill="#a80d14" d="M0,4.4C30,.4 70,.4 100,3.2C70,2.2 30,2.8 0,6Z"/></svg>`;
    if (!combo.destacar || !combo.lema.includes(combo.destacar)) return combo.lema;
    return combo.lema.replace(combo.destacar, `<span class="subrayado">${combo.destacar}${raya}</span>`);
  }

  // ——— El estilo de las imágenes del dueño: el navideño y el pizzero ———

  /** Números al azar, pero siempre los mismos: la hoja sale igual cada vez que se dibuja. */
  function azar(semilla) {
    let s = semilla % 2147483647;
    return () => (s = (s * 16807) % 2147483647) / 2147483647;
  }

  /** Una estrella de cinco puntas. */
  function estrella5(cx, cy, r) {
    let d = "";
    for (let i = 0; i < 10; i++) {
      const a = -Math.PI / 2 + (i * Math.PI) / 5;
      const rr = i % 2 ? r * 0.45 : r;
      d += `${i ? "L" : "M"}${(cx + rr * Math.cos(a)).toFixed(2)},${(cy + rr * Math.sin(a)).toFixed(2)}`;
    }
    return `${d}Z`;
  }

  /** Una rama de pino: el tallo y sus agujas en cinco verdes, de las oscuras (atrás) a las claras, más cortas hacia la punta. */
  function rama(x, y, largo, angulo, semilla, grosor = 1) {
    const r = azar(semilla);
    const a = (angulo * Math.PI) / 180;
    const dx = Math.cos(a), dy = Math.sin(a);
    const CAPAS = [["#05261a", 1.25, 0.62], ["#0b4224", 1.1, 0.56], ["#135a2f", 0.95, 0.5], ["#1f7a41", 0.8, 0.44], ["#43a35c", 0.58, 0.38]];
    const pasos = Math.round(largo * 2);
    let capas = "";
    for (const [verde, largoCapa, ancho] of CAPAS) {
      let agujas = "";
      for (let i = 0; i < pasos; i++) {
        const t = i / pasos;
        const px = x + dx * largo * t + (r() - 0.5) * 0.6;
        const py = y + dy * largo * t + (r() - 0.5) * 0.6;
        const l = (10 - 5.5 * t) * grosor * largoCapa * (0.8 + r() * 0.4);
        for (const lado of [-1, 1]) {
          const b = a + lado * (0.42 + r() * 0.45);
          agujas += `<line x1="${px.toFixed(2)}" y1="${py.toFixed(2)}" x2="${(px + Math.cos(b) * l).toFixed(2)}" y2="${(py + Math.sin(b) * l).toFixed(2)}"/>`;
        }
      }
      capas += `<g stroke="${verde}" stroke-width="${(ancho * grosor).toFixed(2)}">${agujas}</g>`;
    }
    const tallo = `<line x1="${x}" y1="${y}" x2="${(x + dx * largo).toFixed(2)}" y2="${(y + dy * largo).toFixed(2)}" stroke="#4a2c14" stroke-width="${(1.2 * grosor).toFixed(2)}"/>`;
    return `<g stroke-linecap="round">${tallo}${capas}</g>`;
  }
  /** Unas ramas de pino que salen del mismo sitio, abiertas en abanico ([ángulo, largo, grosor]), cada una con dos ramitas. */
  function ramo(x, y, ramas, semilla) {
    return ramas
      .map(([angulo, largo, grosor = 1], i) => {
        const a = (angulo * Math.PI) / 180;
        const ramitas = [[0.34, 32], [0.6, -30]]
          .map(([t, abre], k) => rama(x + Math.cos(a) * largo * t, y + Math.sin(a) * largo * t, largo * 0.42, angulo + abre * (i % 2 ? -1 : 1), semilla + i * 97 + k * 13 + 5, grosor * 0.78))
          .join("");
        return ramitas + rama(x, y, largo, angulo, semilla + i * 97, grosor);
      })
      .join("");
  }

  /** Una bola de Navidad, roja o dorada, con su brillo, su tapita y el hilo de donde cuelga. */
  const bola = (n, x, y, r, tono, hilo = 0) => `
    ${hilo ? `<line x1="${x}" y1="${y - r - hilo}" x2="${x}" y2="${y - r}" stroke="#e7b33f" stroke-width="0.35"/>` : ""}
    <circle cx="${x}" cy="${y}" r="${r}" fill="url(#bola-${tono}-${n})"/>
    <ellipse cx="${x - r * 0.35}" cy="${y - r * 0.38}" rx="${r * 0.28}" ry="${r * 0.17}" transform="rotate(-35 ${x - r * 0.35} ${y - r * 0.38})" fill="#ffffff" fill-opacity=".75"/>
    <rect x="${x - r * 0.26}" y="${y - r * 1.14}" width="${r * 0.52}" height="${r * 0.3}" rx="${r * 0.06}" fill="url(#oroH-${n})" stroke="#8a5a08" stroke-width="0.2"/>`;

  /** Un tomate, con su brillo y su estrella verde arriba. */
  function tomate(n, x, y, r, giro = 0) {
    let caliz = "";
    for (let i = 0; i < 10; i++) {
      const a = -Math.PI / 2 + (i * Math.PI) / 5;
      const rr = i % 2 ? r * 0.1 : r * 0.48;
      caliz += `${i ? "L" : "M"}${(rr * Math.cos(a)).toFixed(2)},${(-r * 0.78 + rr * Math.sin(a) * 0.55).toFixed(2)}`;
    }
    return `<g transform="translate(${x} ${y}) rotate(${giro})">
      <ellipse cx="0" cy="0" rx="${r}" ry="${r * 0.88}" fill="url(#tomate-${n})"/>
      <ellipse cx="${-r * 0.4}" cy="${-r * 0.38}" rx="${r * 0.26}" ry="${r * 0.15}" transform="rotate(-30 ${-r * 0.4} ${-r * 0.38})" fill="#ffffff" fill-opacity=".7"/>
      <path d="${caliz}Z" fill="#2f8a2a" stroke="#1d5e1c" stroke-width="0.25" stroke-linejoin="round"/>
      <path d="M0,${-r * 0.78}Q${r * 0.06},${-r * 1.02} ${r * 0.2},${-r * 1.1}" fill="none" stroke="#2f7a24" stroke-width="${(r * 0.12).toFixed(2)}" stroke-linecap="round"/>
    </g>`;
  }

  /** Una hoja de albahaca, verde brillante, con su nervio; y un manojo de ellas abiertas desde el mismo tallo. */
  const hojaAlbahaca = (n, x, y, largo, giro) => `<g transform="translate(${x} ${y}) rotate(${giro}) scale(${(largo / 24).toFixed(3)})">
      <path d="M0,0C5,-7.5 15,-9.5 24,0C15,9.5 5,7.5 0,0Z" fill="url(#albahaca-${n})" stroke="#1d5e1c" stroke-width="0.5"/>
      <path d="M1,0Q12,-1 22,0" fill="none" stroke="#b5eb9c" stroke-opacity=".7" stroke-width="0.8" stroke-linecap="round"/>
      <path d="M6,-0.5L9,-4.2M11,-0.6L14,-4.8M16,-0.4L18.5,-3.4M6,0.5L9,4.2M11,0.6L14,4.8M16,0.4L18.5,3.4" fill="none" stroke="#b5eb9c" stroke-opacity=".35" stroke-width="0.45" stroke-linecap="round"/>
    </g>`;
  const albahaca = (n, x, y, escala, giro = 0) => {
    const PARES = [[-24, [[-90, 10]]], [-17, [[-138, 11], [-42, 11]]], [-9, [[-158, 12.5], [-22, 12.5]]], [-1.5, [[-172, 11], [-8, 11]]]];
    const hojas = PARES.map(([alto, lados]) => lados.map(([g, l]) => hojaAlbahaca(n, 0, alto, l, g)).join("")).join("");
    return `<g transform="translate(${x} ${y}) rotate(${giro}) scale(${escala})"><path d="M0,4V-24" stroke="#2d7a26" stroke-width="1.1" stroke-linecap="round"/>${hojas}</g>`;
  };

  /** Las luces de fondo, desenfocadas. En el navideño, el verde de los árboles detrás y luces doradas, blancas y algunas rojas y
   *  verdes; en el pizzero, sin nada de Navidad: sombras cálidas y luces doradas y blancas, como las de un local. */
  function luces(n, semilla, navidad = true) {
    const r = azar(semilla);
    let arboles = "", grandes = "", chicas = "";
    for (const [x, y, rx, ry] of [[4, 72, 22, 42], [212, 78, 22, 44], [44, 22, 32, 18], [172, 20, 32, 16], [108, 112, 46, 16]]) {
      arboles += `<ellipse cx="${x}" cy="${y}" rx="${rx}" ry="${ry}" fill="${navidad ? "#0f4220" : "#4a2a10"}" fill-opacity=".6"/>`;
    }
    const tonos = navidad ? ["#ffd77a", "#ffd77a", "#ffe9a8", "#fff4d6", "#ffc04d", "#ff6b5a", "#9fe08c"] : ["#ffd77a", "#ffd77a", "#ffe9a8", "#fff4d6", "#ffc04d", "#ffb347"];
    const tono = () => tonos[Math.floor(r() * tonos.length)];
    for (let i = 0; i < 26; i++) grandes += `<circle cx="${(r() * 216).toFixed(1)}" cy="${(r() * 132).toFixed(1)}" r="${(5 + r() * 7).toFixed(1)}" fill="${tono()}" fill-opacity="${(0.12 + r() * 0.16).toFixed(2)}"/>`;
    for (let i = 0; i < 90; i++) chicas += `<circle cx="${(r() * 216).toFixed(1)}" cy="${(r() * 132).toFixed(1)}" r="${(0.8 + r() * 2.6).toFixed(1)}" fill="${tono()}" fill-opacity="${(0.35 + r() * 0.5).toFixed(2)}"/>`;
    return `<g filter="url(#desenfoque-grande-${n})">${arboles}</g>
      <g filter="url(#desenfoque-${n})" style="mix-blend-mode: screen">${grandes}</g>
      <g filter="url(#desenfoque-chico-${n})" style="mix-blend-mode: screen">${chicas}</g>`;
  }

  /** Un destello dorado de cuatro puntas. */
  const destello = (x, y, r) =>
    `<path d="M${x},${y - r}Q${x + r * 0.16},${y - r * 0.16} ${x + r},${y}Q${x + r * 0.16},${y + r * 0.16} ${x},${y + r}Q${x - r * 0.16},${y + r * 0.16} ${x - r},${y}Q${x - r * 0.16},${y - r * 0.16} ${x},${y - r}Z" fill="#ffe7a0"/>`;

  /** Las rayitas doradas a cada lado de la frase, como un destello; la de la derecha, en espejo. */
  const rayos = (lado) =>
    `<svg class="rayos" viewBox="0 0 10 9" style="transform: scaleX(${lado})"><g stroke="#f2c14e" stroke-width="1" stroke-linecap="round"><path d="M1.5,1.4L6.2,3.5"/><path d="M1,4.6H7.2"/><path d="M1.5,7.8L6.2,5.7"/></g></svg>`;

  /** Las estrellas doradas a los lados del título. */
  const estrellaTitulo = (n, lado) => `<svg class="estrella estrella--${lado}" viewBox="-10 -10 20 20">
      <defs><linearGradient id="oroEstrella-${n}-${lado}" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#fff3b0"/><stop offset=".5" stop-color="#f2c94c"/><stop offset="1" stop-color="#c58a14"/></linearGradient></defs>
      <path d="${estrella5(0, 0.6, 9.4)}" fill="url(#oroEstrella-${n}-${lado})" stroke="#8a5a08" stroke-width=".6" stroke-linejoin="round"/>
    </svg>`;

  /** El oro de los bordes (el de la onda de las otras hojas), los colores de las bolas, el tomate y la albahaca, y los desenfoques. */
  const defsFestivas = (id) => `
    <linearGradient id="oroH-${id}" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#b07c14"/><stop offset=".2" stop-color="#f6d779"/><stop offset=".42" stop-color="#fff1b8"/><stop offset=".62" stop-color="#e0ad3b"/><stop offset=".82" stop-color="#a8740f"/><stop offset="1" stop-color="#f0c95f"/>
    </linearGradient>
    <radialGradient id="bola-roja-${id}" cx=".35" cy=".3" r=".75"><stop offset="0" stop-color="#ff8a80"/><stop offset=".35" stop-color="#e0212a"/><stop offset=".75" stop-color="#9c0d13"/><stop offset="1" stop-color="#5a0508"/></radialGradient>
    <radialGradient id="bola-oro-${id}" cx=".35" cy=".3" r=".75"><stop offset="0" stop-color="#fff6c8"/><stop offset=".35" stop-color="#f2c94c"/><stop offset=".75" stop-color="#b98417"/><stop offset="1" stop-color="#6e4706"/></radialGradient>
    <radialGradient id="tomate-${id}" cx=".35" cy=".32" r=".8"><stop offset="0" stop-color="#ff8a66"/><stop offset=".45" stop-color="#e3261a"/><stop offset="1" stop-color="#8f0f08"/></radialGradient>
    <linearGradient id="albahaca-${id}" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#7fd65e"/><stop offset=".5" stop-color="#3a9a32"/><stop offset="1" stop-color="#1f6a20"/></linearGradient>
    <filter id="desenfoque-grande-${id}" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="7"/></filter>
    <filter id="desenfoque-${id}" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="1.6"/></filter>
    <filter id="desenfoque-chico-${id}" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="0.35"/></filter>
    <filter id="sombra-${id}" x="-10%" y="-30%" width="120%" height="170%"><feGaussianBlur stdDeviation="1.4"/></filter>`;

  /** El fondo de las hojas con este estilo: luces, las ramas de arriba, la placa verde de la cabecera y la mitad de abajo roja. */
  function arteFestivo(n, combo) {
    const oroH = `url(#oroH-${n})`;
    const navidad = combo.estilo === "navidad";
    let abanico = "";
    for (let i = 0; i < 26; i += 2) {
      const a1 = ((8 + i * 6.5) * Math.PI) / 180, a2 = ((8 + (i + 1) * 6.5) * Math.PI) / 180;
      abanico += `<path d="M108,150L${(108 + Math.cos(a1) * 260).toFixed(1)},${(150 + Math.sin(a1) * 260).toFixed(1)}L${(108 + Math.cos(a2) * 260).toFixed(1)},${(150 + Math.sin(a2) * 260).toFixed(1)}Z"/>`;
    }
    const PANEL = "M0,170C60,164.5 156,164.5 216,170V279H0Z";
    // Arriba, a los dos lados: en el navideño, ramas de pino con bolas; en el pizzero, que no lleva nada de Navidad (lo pidió
    // el dueño), una ramita de albahaca y un tomate.
    const arribaIzquierda = navidad ? ramo(-8, -6, [[40, 58], [62, 66], [86, 84, 1.1], [18, 46, 0.9]], 11) : "";
    const arribaDerecha = navidad ? ramo(224, -6, [[140, 58], [118, 66], [94, 86, 1.1], [162, 46, 0.9]], 23) : "";
    const colgantes = navidad
      ? `${bola(n, 9, 66, 5.2, "roja", 7)}${bola(n, 20, 55, 3.6, "oro", 5)}${bola(n, 207, 66, 4.6, "oro", 6)}${bola(n, 197, 57, 3.1, "roja", 4)}`
      : `${albahaca(n, 5, 40, 1, 158)}${tomate(n, 10, 70, 6, -12)}${albahaca(n, 211, 42, 1, -158)}${tomate(n, 206, 73, 5.2, 14)}`;
    // En el pizzero, como en su imagen, albahaca junto a la tocineta y un tomate junto al queso, en el mostrador.
    const mostrador = navidad ? "" : `${albahaca(n, 13, 160, 0.85, -40)}${tomate(n, 201, 152, 6.4, 8)}`;
    return `<svg class="capa capa--arte" viewBox="0 0 216 279" xmlns="http://www.w3.org/2000/svg">
      <defs>
        ${defsFestivas(n)}
        <linearGradient id="oscuro-${n}" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#230c03" stop-opacity=".55"/><stop offset=".85" stop-color="#230c03" stop-opacity=".12"/><stop offset="1" stop-color="#230c03" stop-opacity="0"/></linearGradient>
        <linearGradient id="verdePlaca-${n}" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#17703a"/><stop offset=".5" stop-color="#0d4a26"/><stop offset="1" stop-color="#072f17"/></linearGradient>
        <radialGradient id="rojoPanel-${n}" cx=".5" cy=".15" r=".95"><stop offset="0" stop-color="#d01820"/><stop offset=".55" stop-color="#a50d14"/><stop offset="1" stop-color="#6a060b"/></radialGradient>
        <clipPath id="recortePanel-${n}"><path d="${PANEL}"/></clipPath>
      </defs>

      <rect x="0" y="0" width="216" height="136" fill="url(#oscuro-${n})"/>
      ${luces(n, navidad ? 9 : 31, navidad)}
      ${fondo(combo.fondo)}
      ${arribaIzquierda}${arribaDerecha}${colgantes}
      ${mostrador}

      <!-- La placa verde de la cabecera, con su sombra y su borde dorado -->
      <rect x="4" y="5.5" width="168" height="43" rx="8" fill="#000000" fill-opacity=".55" filter="url(#sombra-${n})"/>
      <rect x="3" y="2.5" width="168" height="43" rx="8" fill="url(#verdePlaca-${n})" stroke="${oroH}" stroke-width="1.6"/>
      <path d="M6,6Q87,1 168,6V19Q87,14 6,21Z" fill="#ffffff" fill-opacity=".05"/>
      <rect x="5.3" y="4.8" width="163.4" height="38.4" rx="6" fill="none" stroke="#fff1b8" stroke-opacity=".45" stroke-width=".3"/>

      <!-- La mitad de abajo, roja, con rayos de luz y unos destellos a los lados -->
      <path d="${PANEL}" fill="url(#rojoPanel-${n})"/>
      <g clip-path="url(#recortePanel-${n})" fill="#ffffff" fill-opacity=".045">${abanico}</g>
      ${[[5, 196, 1.6], [211, 204, 1.9], [4, 214, 1.1], [212, 190, 1.2], [6, 182, 1.2], [210, 218, 1.3]].map(([x, y, r]) => destello(x, y, r)).join("")}
      <path d="M0,170C60,164.5 156,164.5 216,170" fill="none" stroke="${oroH}" stroke-width="1.4"/>
    </svg>`;
  }

  /** Unas hojas verdes a los dos lados de los productos, sobre el mostrador: las del solidario. */
  const hojasALosLados = (n) => `<svg class="capa capa--arte" viewBox="0 0 216 279" xmlns="http://www.w3.org/2000/svg">
      <defs>${defsFestivas(`${n}-hojas`)}</defs>
      ${albahaca(`${n}-hojas`, 5, 158, 0.85, 24)}${albahaca(`${n}-hojas`, 211, 158, 0.85, -24)}
    </svg>`;

  /** Las ramitas de pino que asoman por encima de las esquinas de arriba, como en las imágenes del dueño. */
  const ramitasDeArriba = () => `<svg class="capa capa--encima" viewBox="0 0 216 279" xmlns="http://www.w3.org/2000/svg">
      ${ramo(-6, -6, [[28, 14, 0.75], [58, 15, 0.75]], 61)}${ramo(222, -6, [[122, 15, 0.75], [152, 14, 0.75]], 71)}
    </svg>`;

  /** Lo que va encima de todo, en la esquina de abajo a la izquierda (la de la derecha es de la etiqueta del precio): ramas,
   *  una bola, el acebo y el lazo en el navideño; tomates y albahaca en el pizzero y el sandwichero. */
  function esquinasFestivas(n, combo) {
    const id = `${n}-encima`;
    const contenido =
      combo.estilo === "navidad"
        ? `${ramo(-8, 288, [[-82, 34], [-58, 32], [-34, 30], [-12, 28, 0.9]], 41)}
           ${bola(id, 12, 271, 4.6, "oro")}
           ${ADORNOS.acebo.replace('class="adorno adorno--acebo"', 'x="22" y="264" width="20" height="14"')}
           ${ADORNOS.moño.replace('class="adorno adorno--moño"', 'x="0" y="238" width="25" height="20"')}`
        : `${tomate(id, 5, 236, 9, -10)}${albahaca(id, 3, 281, 0.8, 18)}${tomate(id, 24, 273, 6.4, 12)}`;
    return `<svg class="capa capa--encima" viewBox="0 0 216 279" xmlns="http://www.w3.org/2000/svg"><defs>${defsFestivas(id)}</defs>${contenido}</svg>`;
  }

  for (const combo of COMBOS) {
    const hoja = document.createElement("article");
    // navidad, pizza y sandwich: el estilo de las imágenes del dueño (placa verde, mitad de abajo roja); solidario: la hoja roja, pulida.
    const festiva = ["navidad", "pizza", "sandwich"].includes(combo.estilo);
    hoja.className = [
      "hoja",
      combo.especial ? "hoja--especial" : "",
      combo.productos.length > 2 ? "hoja--tres" : "",
      combo.separado ? "hoja--separado" : "",
      festiva ? "hoja--festiva" : "",
      combo.estilo ? `hoja--${combo.estilo}` : "",
    ]
      .filter(Boolean)
      .join(" ");
    hoja.dataset.archivo = `combo-${combo.n}-carta`;
    hoja.dataset.ppp = "300";
    hoja.dataset.formato = "jpeg";
    const lineas = combo.titulo
      ? `<div class="etiqueta">${combo.etiqueta ?? "Combo especial"}</div><span class="linea">${combo.titulo}</span>${festiva ? estrellaTitulo(combo.n, "izquierda") + estrellaTitulo(combo.n, "derecha") : ""}`
      : combo.productos.map(([, nombre], i) => `<span class="linea">${nombre}${i < combo.productos.length - 1 ? " +" : ""}</span>`).join("");
    const piezas = combo.productos.map(([foto, , adorno]) => `<span class="pieza" style="--cm: ${CM[foto]}"><img src="fotos/${foto}.png" alt="">${adorno ? ADORNOS[adorno] : ""}</span>`).join("");
    if (combo.alto) hoja.dataset.alto = combo.alto;
    hoja.innerHTML = `
      <img class="estante" src="fondos/estante.jpg" alt="">
      <img class="madera" src="fondos/madera.jpg" alt="">
      <div class="luz"></div><div class="canto"></div>
      ${festiva ? arteFestivo(combo.n, combo) : arte(combo.n, combo.fondo)}
      ${combo.estilo === "solidario" ? hojasALosLados(combo.n) : ""}
      <img class="leon" src="../public/marca/leon.svg" alt="">
      <div class="raya"></div>
      <div class="charcuteria">CHARCUTERÍA</div>
      <div class="nombre">Villa Real</div>
      ${sello(combo.n, Boolean(combo.estilo))}
      <div class="productos">${piezas}</div>
      <section class="contenido">
        <div class="titulo">${lineas}</div>
        <div class="fila-pildora"><div class="pildora${clasePildora(combo.detalle)}">${enMayusculas(combo.detalle)}</div></div>
        <div class="frase">${festiva ? `${rayos(1)}<span>${combo.lema}</span>${rayos(-1)}` : frase(combo)}</div>
        <div class="precio"><span>$</span></div>
      </section>
      ${festiva ? esquinasFestivas(combo.n, combo) : ""}${combo.estilo === "navidad" ? ramitasDeArriba() : ""}
`;
    document.body.append(hoja);
  }

  // La escala de cada hoja: lo más alto del combo llega hasta la onda dorada, salvo que el conjunto no quepa a lo ancho.
  // Entre los productos de un mismo combo la proporción es la de la vida real (CM, en combos-datos.js).
  window.addEventListener("load", () => {
    const ALTO_MM = 106;
    const ANCHO_MM = 198;
    const BASE_MM = 158;
    const SELLO_IZQUIERDA_MM = 162;
    const SELLO_ABAJO_MM = 52;
    for (const hoja of document.querySelectorAll(".hoja")) {
      const piezas = [...hoja.querySelectorAll(".pieza")].map((p) => {
        const img = p.querySelector("img");
        return { cm: Number(p.style.getPropertyValue("--cm")), aspecto: img.naturalWidth / img.naturalHeight };
      });
      const solape = hoja.classList.contains("hoja--separado") ? -3 : hoja.classList.contains("hoja--tres") ? 7 : 10;
      const anchoPorEscala = piezas.reduce((suma, p) => suma + p.cm * p.aspecto, 0);
      const alto = Number(hoja.dataset.alto) || ALTO_MM;
      let escala = Math.min(alto / Math.max(...piezas.map((p) => p.cm)), (ANCHO_MM + solape * (piezas.length - 1)) / anchoPorEscala);
      // Lo que queda a la derecha, si llega hasta debajo del sello, no puede subir más que él.
      const ultima = piezas.at(-1);
      const bordeDerecho = 108 + (anchoPorEscala * escala - solape * (piezas.length - 1)) / 2;
      if (bordeDerecho > SELLO_IZQUIERDA_MM && ultima.cm * escala > BASE_MM - SELLO_ABAJO_MM) escala = (BASE_MM - SELLO_ABAJO_MM) / ultima.cm;
      hoja.style.setProperty("--mm-por-cm", escala.toFixed(3));
    }
  });

  // Un nombre largo no se sale de la hoja: encoge lo justo.
  document.fonts.ready.then(() => {
    for (const linea of document.querySelectorAll(".linea")) {
      const padre = getComputedStyle(linea.parentElement);
      const caja = linea.parentElement.getBoundingClientRect().width - parseFloat(padre.paddingLeft) - parseFloat(padre.paddingRight) - parseFloat(padre.borderLeftWidth) * 2;
      linea.style.display = "inline-block";
      let tamano = parseFloat(getComputedStyle(linea).fontSize);
      while (linea.getBoundingClientRect().width > caja && tamano > 20) {
        tamano -= 0.5;
        linea.style.fontSize = `${tamano}px`;
      }
      linea.style.display = "";
    }
  });
</script>
</body>
</html>
