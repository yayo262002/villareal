<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Flier de hamburguesas (el de ChatGPT, con los productos de verdad) · Villa Real</title>
<style>
  /* El flier de hamburguesas que el dueño hizo con ChatGPT (25/11/2026), tal cual, con los productos de verdad y el león de
     la marca en vez del dibujado. El fondo y la cinta los saca flier-chatgpt-base.mjs. Todo va en las medidas de la imagen
     de ChatGPT (941 × 1672) y se agranda a 1080 × 1920. Los precios son los de la imagen: si cambian, hay que rehacerla.
     26/11/2026 (el dueño: «el pan de hamburguesa mucho más grande, que sea todo bien proporcionado con las medidas de la
     vida real», y después «el pan Fresco un poco más grande»): los productos que dibujó ChatGPT se borran del fondo
     (flier-chatgpt-base-limpia.mjs: fondos/chatgpt-hamburguesas-limpia.png), encima va una tabla de madera, y encima van los de
     verdad, todos a la misma escala, unos 8 px por centímetro: el queso de 29 cm, el pan Brioche de 8 (21 cm de ancho; 28
     de alto, algo más que en la vida real, como pidió), las papas de 150 g de 27 cm, la Big Cola de 2 L de 33 cm, la Pepsi
     de 1,5 L de 31 cm y la carne Hot Burger de 11 cm.
     26/11/2026, más tarde: los combos ya no llevan salsa (cada pote es un adicional de 0,50 $ que elige el cliente) y bajan a
     8,92 y 11,54 $. Encima de lo que dice la imagen de ChatGPT van, sobre parches de su color, los precios, «Salsa adicional»
     y lo que sale cada hamburguesa; la cinta, sin «CON SALSAS» (flier-cinta-sin-salsas.mjs), dice «PARA TU NEGOCIO». Va
     también el pan de hamburguesa artesanal (la foto la mandó el dueño), delante a la derecha, a la misma escala; las
     botellas, un poco más atrás para que se vean por encima de él. */
  @font-face { font-family: "Open Sans"; src: url("fuentes/OpenSans.ttf"); font-weight: 300 800; font-stretch: 75% 100%; font-style: normal; }
  html, body { margin: 0; padding: 0; background: #5a0507; }
  .lienzo { width: 1080px; height: 1920px; overflow: hidden; }
  .flier { position: relative; width: 941px; height: 1672px; transform: scale(1.14772); transform-origin: 0 0; background: url("fondos/chatgpt-hamburguesas-limpia.png") 0 0 / 941px 1672px no-repeat; }
  .flier > * { position: absolute; }
  .flier img { display: block; }
  .p { filter: drop-shadow(0 10px 10px rgba(40, 0, 0, 0.55)); }
  .madera {
    left: 198px; top: 598px; width: 560px; height: 57px; z-index: 0; background: url("fondos/madera.jpg") center / cover; filter: saturate(1.1) brightness(0.8);
    box-shadow: inset 0 12px 16px rgba(40, 10, 0, 0.6);
    -webkit-mask-image: linear-gradient(90deg, transparent 0, #000 14px, #000 calc(100% - 16px), transparent 100%), linear-gradient(180deg, transparent 0, #000 10px);
    -webkit-mask-composite: source-in;
    mask-image: linear-gradient(90deg, transparent 0, #000 14px, #000 calc(100% - 16px), transparent 100%), linear-gradient(180deg, transparent 0, #000 10px);
    mask-composite: intersect;
  }
  /* «ARTESANAL» no le gusta al dueño (25/11/2026): encima, el mismo rojo de la pincelada y «CLÁSICO». */
  @font-face { font-family: "Archivo Black"; src: url("../src/assets/fuentes/ArchivoBlack-Regular.ttf"); }
  .nombre-combo { left: 86px; top: 672px; width: 214px; height: 44px; z-index: 4; border-radius: 8px; background: linear-gradient(180deg, rgb(241, 24, 20), rgb(229, 10, 10)); box-shadow: 0 0 6px 3px rgb(236, 16, 14); display: grid; place-items: center; }
  .nombre-combo span { font-family: "Archivo Black"; font-size: 35px; line-height: 1; color: #ffffff; letter-spacing: 0.03em; transform: skewX(-9deg); text-shadow: 0 2px 0 rgba(120, 0, 0, 0.45); }
  .cinta { left: 278px; top: 544px; width: 366px; z-index: 5; }
  .cinta-texto { left: 282px; top: 562px; width: 330px; z-index: 5; text-align: center; font-family: "Archivo Black"; font-size: 26px; line-height: 1; color: #111111; white-space: nowrap; transform: rotate(-6deg); }
  /* Los parches de las tarjetas (los mismos sitios que en el flier de perros, que sale de la misma imagen). */
  .crema { z-index: 3; background: rgb(250, 246, 240); box-shadow: 0 0 6px 5px rgb(250, 246, 240); border-radius: 6px; }
  .rojo { z-index: 3; border-radius: 10px; background: radial-gradient(ellipse at 50% 40%, rgb(242, 18, 16) 0%, rgb(226, 10, 10) 60%, rgb(200, 6, 6) 100%); box-shadow: 0 0 5px 4px rgb(228, 10, 10); }
  .amarillo { z-index: 3; border-radius: 999px; background: linear-gradient(180deg, rgb(255, 217, 37) 0%, rgb(254, 204, 2) 50%, rgb(250, 182, 2) 100%); box-shadow: 0 0 4px 3px rgb(254, 204, 2); }
  .salsa { z-index: 4; font-family: "Open Sans", Arial, sans-serif; font-weight: 800; font-size: 24px; line-height: 1; color: #b3121a; white-space: nowrap; }
  .sale { z-index: 4; width: 755px; text-align: center; font-family: "Open Sans", Arial, sans-serif; font-weight: 800; font-size: 25px; line-height: 1; color: #1d1a18; white-space: nowrap; }
  .sale b {
    font-family: "Archivo Black"; font-weight: 400; font-size: 34px; color: #e3141c; -webkit-text-stroke: 5px #ffffff; paint-order: stroke fill; text-shadow: 0 3px 0 #7d080d;
    margin: 0 4px;
  }
  .precio {
    z-index: 4; width: 300px; text-align: center; font-family: "Archivo Black"; font-size: 80px; line-height: 1; color: #ffffff; white-space: nowrap; letter-spacing: -0.02em;
    -webkit-text-stroke: 11px #4a0202; paint-order: stroke fill; text-shadow: 0 7px 0 #300101; transform: skewX(-6deg);
  }
  .precio span { font-size: 58px; }
  .brillo { left: -10px; top: -45px; width: 264px; height: 345px; z-index: 5; border-radius: 50%; background: radial-gradient(closest-side, rgb(166, 8, 7) 72%, rgba(166, 8, 7, 0) 100%); }
  .leon { left: 40px; top: 18px; width: 158px; z-index: 6; filter: drop-shadow(0 6px 8px rgba(40, 0, 0, 0.6)); }
</style>
</head>
<body>
<div class="lienzo">
  <div class="flier">
    <div class="madera"></div>
    <!-- Los productos, a escala (alto en px ≈ 8 × cm), de pie sobre la tabla; delante, la carne y el pan artesanal (y las
         botellas, que quedan detrás de él, un poco más atrás en la tabla). -->
    <img class="p" src="fotos/queso-amarillo.png" alt="" style="left: 206px; top: 390px; height: 232px; z-index: 1">
    <img class="p" src="fotos/papas-ralladas.png" alt="" style="left: 476px; top: 402px; height: 216px; z-index: 1">
    <img class="p" src="fotos/big-cola.png" alt="" style="left: 628px; top: 334px; height: 264px; z-index: 1">
    <img class="p" src="fotos/pepsi.png" alt="" style="left: 702px; top: 350px; height: 248px; z-index: 1">
    <img class="p" src="fotos/pan-hamburguesa.png" alt="" style="left: 296px; top: 392px; height: 224px; z-index: 2">
    <img class="p" src="fotos/carne-hot-burger.png" alt="" style="left: 214px; top: 552px; height: 69px; z-index: 3; transform: rotate(-6deg)">
    <img class="p" src="fotos/pan-hamburguesa-artesanal.png" alt="" style="left: 604px; top: 482px; height: 140px; z-index: 3">
    <div class="nombre-combo"><span>CLÁSICO</span></div>
    <img class="cinta" src="fondos/chatgpt-cinta-sin-salsas.png" alt="">
    <div class="cinta-texto">PARA TU NEGOCIO</div>

    <!-- La primera tarjeta: precio, salsa y lo que sale cada hamburguesa. -->
    <div class="rojo" style="left: 612px; top: 708px; width: 284px; height: 80px"></div>
    <div class="precio" style="left: 604px; top: 704px">8,92<span> $</span></div>
    <div class="crema" style="left: 116px; top: 899px; width: 620px; height: 32px"></div>
    <div class="salsa" style="left: 120px; top: 903px">Salsa adicional: 0,50 $ el pote, la que elijas</div>
    <div class="amarillo" style="left: 118px; top: 946px; width: 716px; height: 38px"></div>
    <div class="sale" style="left: 98px; top: 950px">Sale a <b>0,89 $</b> cada hamburguesa con papas y refresco</div>

    <!-- La segunda. -->
    <div class="rojo" style="left: 612px; top: 1066px; width: 284px; height: 80px"></div>
    <div class="precio" style="left: 604px; top: 1062px">11,54<span> $</span></div>
    <div class="crema" style="left: 116px; top: 1294px; width: 760px; height: 28px; box-shadow: 0 0 3px 2px rgb(250, 246, 240)"></div>
    <div class="salsa" style="left: 120px; top: 1296px">Salsa adicional: 0,50 $ el pote, la que elijas</div>
    <div class="amarillo" style="left: 118px; top: 1334px; width: 716px; height: 38px"></div>
    <div class="sale" style="left: 98px; top: 1338px">Sale a <b>1,44 $</b> cada hamburguesa con papas y refresco</div>
    <div class="brillo"></div>
    <img class="leon" src="../public/marca/leon.svg" alt="">
  </div>
</div>
</body>
</html>
