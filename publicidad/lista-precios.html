<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Lista de precios · Villa Real</title>
<style>
  /* Open Sans (OFL, en fuentes/), como las hojas de los combos. */
  @font-face { font-family: "Open Sans"; src: url("fuentes/OpenSans.ttf"); font-weight: 300 800; font-stretch: 75% 100%; font-style: normal; }

  /* La lista de precios del detal para mostrarla en el teléfono. Los datos los escribe `npm run lista`
     en lista-precios-datos.js (no va al repositorio: cambia cada día). Salen dos cosas:
     - un PDF de una sola página larga, del ancho de un teléfono (data-solo="pdf");
     - las mismas filas repartidas en pantallas de 9:16, en JPG, para mandarlas como fotos (data-solo="imagen"). */
  @page { margin: 0; }
  html, body { margin: 0; background: #888; }
  body { font-family: "Open Sans", Arial, sans-serif; display: flex; flex-wrap: wrap; align-items: flex-start; gap: 20px; padding: 20px; }

  .lista {
    --rojo: #b3231d; --rojo-oscuro: #7c0a10; --oro: #e9b13a; --crema: #fbf3e2; --crema-fila: #f6ead3; --tinta: #1f1612; --tinta-suave: #6b5d55;
    box-sizing: border-box; width: 360px; background: var(--crema); color: var(--tinta); overflow: hidden;
  }
  .pantalla { height: 640px; display: flex; flex-direction: column; }

  .cabecera { background: var(--rojo); color: var(--crema); border-bottom: 4px solid var(--oro); padding: 14px 16px 12px; display: grid; grid-template-columns: auto 1fr; column-gap: 12px; align-items: center; }
  .cabecera img { width: 46px; height: 66px; display: block; }
  .cabecera .charcuteria { font-weight: 800; font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--oro); }
  .cabecera h1 { margin: 2px 0 0; font-weight: 800; font-size: 25px; line-height: 1.05; }
  .cabecera .fecha { margin: 4px 0 0; font-size: 12.5px; font-weight: 600; text-transform: capitalize; }
  .cabecera .tasa { margin: 2px 0 0; font-size: 12.5px; }
  .cabecera .tasa b { color: var(--oro); font-weight: 800; }
  .pantalla .cabecera { padding: 10px 14px 9px; }
  .pantalla .cabecera img { width: 36px; height: 52px; }
  .pantalla .cabecera h1 { font-size: 21px; }
  .pagina-n { font-size: 11px; font-weight: 700; color: var(--oro); }

  .cuerpo { padding: 6px 12px 10px; }
  .pantalla .cuerpo { flex: 1; overflow: hidden; padding: 4px 12px 0; }

  .categoria { margin: 12px 0 4px; padding-bottom: 3px; border-bottom: 2px solid var(--oro); font-weight: 800; font-size: 14px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--rojo-oscuro); }
  .fila { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 6px 6px; border-radius: 6px; }
  .fila:nth-of-type(even) { background: var(--crema-fila); }
  .nombre { font-size: 14px; font-weight: 600; line-height: 1.2; min-width: 0; }
  .nombre small { font-weight: 500; color: var(--tinta-suave); }
  .precios { text-align: right; flex: none; }
  .bs { font-weight: 800; font-size: 16px; line-height: 1.1; white-space: nowrap; color: var(--rojo-oscuro); }
  .usd { font-size: 12.5px; font-weight: 600; line-height: 1.15; white-space: nowrap; color: var(--tinta-suave); }
  .mayor { font-size: 11px; white-space: nowrap; color: var(--tinta-suave); }

  .nota { margin: 10px 4px 2px; font-size: 11px; line-height: 1.35; color: var(--tinta-suave); }
  .pantalla .nota { margin: 0; padding: 6px 14px 10px; background: var(--crema); }
</style>
</head>
<body>
<script>window.listo = false;</script>
<script src="lista-precios-datos.js"></script>
<script>
  const L = globalThis.LISTA;
  const bs = (n) => "Bs " + n.toLocaleString("es-VE", { maximumFractionDigits: 2 });
  const usd = (n) => "$" + n.toLocaleString("es-VE", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const tasa = L.tasa ? L.tasa.toLocaleString("es-VE", { minimumFractionDigits: 2, maximumFractionDigits: 2 }) : null;

  const cabecera = (extra = "") => `
    <header class="cabecera">
      <img src="../public/marca/leon.svg" alt="">
      <div>
        <div class="charcuteria">Charcutería Villa Real ${extra}</div>
        <h1>Lista de precios</h1>
        <p class="fecha">${L.fechaLarga}</p>
        <p class="tasa">${tasa ? `Tasa BCV: <b>${tasa}</b> Bs por dólar` : "Sin tasa: precios en dólares"}</p>
      </div>
    </header>`;
  // «397 g», «1 l», «×10»: el número y su unidad no se separan al partir la línea.
  const pegarUnidad = (nombre) => nombre.replace(/(\d) (?=(g|kg|ml|l|cm)\b)/g, "$1\u00a0").replace(/ ×/g, "\u00a0×");
  const nota = `<p class="nota">Bolívares a la tasa del BCV de este día, subidos de ${L.redondeo} en ${L.redondeo}. Cambian cada día con la tasa.</p>`;
  const fila = (a) => `
    <div class="fila">
      <div class="nombre">${pegarUnidad(a.nombre)}${a.unidad === "kg" ? " <small>· el kilo</small>" : ""}</div>
      <div class="precios">
        <div class="bs">${a.bs !== null ? bs(a.bs) : usd(a.usd)}</div>
        ${a.bs !== null ? `<div class="usd">${usd(a.usd)}</div>` : ""}
        ${a.mayor_usd !== null ? `<div class="mayor">Mayor ${a.mayor_bs !== null ? bs(a.mayor_bs) + " · " : ""}${usd(a.mayor_usd)}</div>` : ""}
      </div>
    </div>`;

  // El PDF: todo en una página larga.
  const larga = document.createElement("article");
  larga.className = "lista";
  larga.dataset.archivo = "lista-precios";
  larga.dataset.solo = "pdf";
  larga.innerHTML = cabecera() + `<div class="cuerpo">${L.grupos.map((g) => `<h2 class="categoria">${g.nombre}</h2>${g.articulos.map(fila).join("")}`).join("")}${nota}</div>`;
  document.body.append(larga);

  // Las pantallas: se llenan fila a fila y, cuando una ya no cabe, sigue en la siguiente (con su categoría repetida).
  function nuevaPantalla(n) {
    const p = document.createElement("article");
    p.className = "lista pantalla";
    p.dataset.archivo = `lista-precios-${n}`;
    p.dataset.solo = "imagen";
    p.dataset.formato = "jpeg";
    p.dataset.ppp = "288";
    p.innerHTML = cabecera(`<span class="pagina-n">· ${n}/__TOTAL__</span>`) + `<div class="cuerpo"></div>` + nota;
    document.body.append(p);
    return p;
  }
  const cabe = (p) => {
    const c = p.querySelector(".cuerpo");
    return c.scrollHeight <= c.clientHeight + 1;
  };
  function paginar() {
    let n = 1;
    let p = nuevaPantalla(n);
    for (const g of L.grupos) {
      let titulo = null;
      for (const a of g.articulos) {
        const cuerpo = p.querySelector(".cuerpo");
        if (!titulo) {
          // Una categoría no empieza al pie de una pantalla con una sola fila: si queda poco sitio, pasa a la siguiente.
          if (cuerpo.children.length > 0 && cuerpo.clientHeight - cuerpo.scrollHeight < 150) {
            p = nuevaPantalla(++n);
            titulo = null;
          }
          const destino = p.querySelector(".cuerpo");
          titulo = document.createElement("h2");
          titulo.className = "categoria";
          titulo.textContent = g.nombre;
          destino.append(titulo);
        }
        const plantilla = document.createElement("template");
        plantilla.innerHTML = fila(a).trim();
        const nodo = plantilla.content.firstElementChild;
        const aqui = p.querySelector(".cuerpo");
        aqui.append(nodo);
        if (!cabe(p)) {
          nodo.remove();
          if (aqui.lastElementChild === titulo) titulo.remove();
          p = nuevaPantalla(++n);
          const sigue = document.createElement("h2");
          sigue.className = "categoria";
          sigue.textContent = g.nombre;
          p.querySelector(".cuerpo").append(sigue, nodo);
          titulo = sigue;
        }
      }
    }
    for (const pantalla of document.querySelectorAll(".pantalla")) pantalla.innerHTML = pantalla.innerHTML.replace("__TOTAL__", String(n));
    // La página larga, a un alto entero y con un poco de aire: si el PDF mide una fracción menos que la lista, sale una segunda página en blanco.
    larga.style.height = Math.ceil(larga.getBoundingClientRect().height) + 8 + "px";
    window.listo = true;
  }
  document.fonts.ready.then(paginar);
</script>
</body>
</html>
