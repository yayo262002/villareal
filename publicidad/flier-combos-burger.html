<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Flier de los combos del burger · Villa Real</title>
<style>
  /* Los fliers de los combos del burger: uno de hamburguesas y otro de perros, cada uno con sus dos combos (artesanal y
     premium), lo que llevan y su precio de hoy en dólares. Como el afiche de los combos en la web (rojo, marco dorado,
     rayos y la etiqueta amarilla del precio), que es lo que pidió el dueño para los combos. ?tipo=hamburguesas|perros y
     ?formato=estado (1080 × 1920, el estado de WhatsApp) o post (1080 × 1350, Instagram). Los datos (precios de la base)
     los escribe flier-combos-burger.mjs en flier-combos-datos.js, que no va al repositorio. Las fotos son de la mercancía. */
  @font-face { font-family: "Archivo Black"; src: url("../src/assets/fuentes/ArchivoBlack-Regular.ttf"); }
  @font-face { font-family: "Open Sans"; src: url("fuentes/OpenSans.ttf"); font-weight: 300 800; font-stretch: 75% 100%; font-style: normal; }
  @font-face { font-family: "Kaushan Script"; src: url("fuentes/KaushanScript-Regular.ttf"); }

  html, body { margin: 0; padding: 0; background: #5a0507; }
  * { box-sizing: border-box; }

  .flier {
    --rojo: #c8141c; --rojo-hondo: #7d080d; --oro: #e9b13a; --oro-claro: #ffd76a; --amarillo: #ffd23f; --crema: #fbf3e2; --tinta: #1f1612; --tinta-suave: #5e4f47;
    position: relative; width: 1080px; height: 1920px; overflow: hidden; color: var(--crema); font-family: "Open Sans", Arial, sans-serif;
    background: radial-gradient(ellipse 90% 60% at 50% 22%, #e0262c 0%, #b8121a 45%, #7d080d 100%);
    display: grid; grid-template-rows: auto auto 1fr auto; isolation: isolate;
  }
  .flier.post { height: 1350px; }
  /* Los rayos de luz desde arriba, y el marco dorado. */
  .flier::before {
    content: ""; position: absolute; inset: -40%; z-index: -1; opacity: 0.5;
    background: repeating-conic-gradient(from 0deg at 50% 32%, rgba(255, 214, 120, 0.16) 0deg 7deg, transparent 7deg 18deg);
  }
  .flier::after { content: ""; position: absolute; inset: 22px; border: 6px solid var(--oro); border-radius: 30px; box-shadow: inset 0 0 0 3px rgba(255, 215, 106, 0.35); pointer-events: none; }

  /* Arriba: el león, la marca y el título. */
  .cabecera { display: grid; grid-template-columns: auto 1fr; column-gap: 26px; align-items: center; padding: 58px 70px 0; }
  .cabecera img { width: 112px; height: auto; filter: drop-shadow(0 6px 10px rgba(40, 5, 0, 0.45)); }
  .marca { font-family: "Archivo Black"; font-size: 30px; letter-spacing: 0.2em; color: var(--oro-claro); line-height: 1; }
  .titulo { font-family: "Archivo Black"; font-size: 150px; line-height: 0.88; margin-top: 12px; letter-spacing: 0.01em; text-shadow: 0 8px 0 #5a0507; }
  .de { display: block; font-family: "Kaushan Script", cursive; font-size: 78px; line-height: 1.05; color: var(--amarillo); text-shadow: 0 5px 0 #5a0507; margin-top: 6px; letter-spacing: 0; }

  /* La foto de la mercancía, con su cinta. */
  /* Los productos del combo, uno al lado del otro, de pie sobre la misma línea y cada uno a su altura (--alto, en % del hueco). */
  .heroe { position: relative; z-index: 2; display: flex; justify-content: center; align-items: flex-end; gap: 14px; padding: 14px 70px 42px; height: 388px; }
  .heroe img { height: calc(var(--alto, 100) * 1%); max-width: 46%; min-width: 0; object-fit: contain; object-position: center bottom; filter: drop-shadow(0 22px 22px rgba(40, 0, 0, 0.5)); }
  .cinta {
    position: absolute; left: 50%; bottom: -34px; z-index: 3; transform: translateX(-50%) rotate(-4deg); white-space: nowrap; background: var(--amarillo); color: var(--rojo-hondo); font-family: "Archivo Black";
    font-size: 34px; line-height: 1; padding: 14px 24px 12px; border-radius: 14px; box-shadow: 0 10px 0 #a8740f, 0 18px 24px rgba(40, 0, 0, 0.4); text-align: center;
  }
  .cinta small { display: block; font-size: 22px; letter-spacing: 0.12em; margin-bottom: 4px; }

  /* Los dos combos. */
  .combos { position: relative; z-index: 1; display: grid; gap: 24px; padding: 30px 60px 0; align-content: start; }
  .combo {
    position: relative; background: var(--crema); color: var(--tinta); border: 5px solid var(--oro); border-radius: 30px; padding: 26px 32px 22px;
    box-shadow: 0 14px 0 rgba(90, 5, 8, 0.55), 0 24px 34px rgba(40, 0, 0, 0.35);
    display: grid; grid-template-columns: 1fr auto; column-gap: 22px; align-items: start;
  }
  .combo.premium { background: linear-gradient(180deg, #fff4d6, var(--crema)); }
  .insignia {
    display: inline-block; font-family: "Archivo Black"; font-size: 24px; letter-spacing: 0.16em; padding: 8px 18px 7px; border-radius: 999px;
    background: var(--rojo); color: var(--crema);
  }
  .premium .insignia { background: var(--rojo-hondo); color: var(--oro-claro); }
  .cuantas { font-family: "Archivo Black"; font-size: 52px; line-height: 1; color: var(--rojo); margin: 12px 0 0; white-space: nowrap; }
  .cuantas small { display: block; font-family: "Open Sans"; font-weight: 700; font-size: 25px; color: var(--tinta-suave); margin-top: 4px; white-space: normal; }
  .lleva { list-style: none; margin: 16px 0 0; padding: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 8px 18px; grid-column: 1 / -1; }
  .lleva li { position: relative; padding-left: 42px; font-weight: 600; font-size: 27px; line-height: 1.2; }
  .lleva li::before {
    content: "✓"; position: absolute; left: 0; top: 2px; width: 32px; height: 32px; border-radius: 50%; background: var(--oro); color: var(--rojo-hondo);
    font-weight: 800; font-size: 22px; line-height: 32px; text-align: center;
  }
  .lleva li.salsas { grid-column: 1 / -1; color: var(--rojo-hondo); font-weight: 700; }
  .precio {
    transform: rotate(4deg); background: var(--amarillo); color: var(--rojo-hondo); border: 3px solid #a8740f; border-radius: 18px; padding: 12px 22px 10px; text-align: center;
    box-shadow: 0 8px 0 #a8740f; margin-top: 6px;
  }
  .precio small { display: block; font-family: "Archivo Black"; font-size: 20px; letter-spacing: 0.16em; }
  .precio b { display: block; font-family: "Archivo Black"; font-weight: 400; font-size: 66px; line-height: 1; white-space: nowrap; }
  .cada { grid-column: 1 / -1; margin-top: 14px; padding-top: 12px; border-top: 3px dashed #e2c98f; font-weight: 700; font-size: 27px; color: var(--tinta-suave); }
  .cada b { color: var(--rojo); font-family: "Archivo Black"; font-weight: 400; }

  /* Abajo: cómo pedirlo. */
  .pie { padding: 14px 70px 54px; text-align: center; align-self: end; }
  .pide { font-family: "Kaushan Script", cursive; font-size: 52px; line-height: 1.1; color: var(--amarillo); text-shadow: 0 4px 0 #5a0507; }
  .whatsapp {
    display: inline-flex; align-items: center; gap: 16px; margin-top: 14px; background: #25d366; color: #ffffff; font-family: "Archivo Black"; font-size: 52px; line-height: 1;
    padding: 18px 36px 16px; border-radius: 999px; box-shadow: 0 8px 0 #148a42, 0 16px 22px rgba(40, 0, 0, 0.35);
  }
  .whatsapp svg { width: 54px; height: 54px; }
  .donde { margin-top: 16px; font-weight: 700; font-size: 28px; line-height: 1.35; color: var(--crema); }
  .donde span { color: var(--oro-claro); }

  /* El post de Instagram (1080 × 1350): los dos combos uno al lado del otro y la foto más pequeña. */
  .post .cabecera { padding: 60px 64px 0; }
  .post .cabecera img { width: 92px; }
  .post .titulo { font-size: 118px; }
  .post .de { font-size: 62px; }
  .post .heroe { height: 270px; padding-top: 8px; padding-bottom: 10px; }
  .post .cinta { display: none; }
  .post .cinta small { font-size: 17px; }
  .post .combos { grid-template-columns: 1fr 1fr; gap: 22px; padding: 26px 50px 0; }
  .post .combo { grid-template-columns: 1fr; padding: 22px 22px 20px; border-radius: 24px; }
  .post .cuantas { font-size: 40px; white-space: normal; }
  .post .cuantas small { font-size: 20px; }
  .post .insignia { font-size: 18px; }
  .post .lleva { grid-template-columns: 1fr; gap: 4px; margin-top: 10px; }
  .post .lleva li { font-size: 21px; padding-left: 32px; }
  .post .lleva li::before { width: 24px; height: 24px; font-size: 16px; line-height: 24px; }
  .post .precio { position: absolute; top: -18px; right: -12px; padding: 8px 14px 6px; margin: 0; }
  .post .precio b { font-size: 44px; }
  .post .precio small { font-size: 14px; }
  .post .cada { font-size: 20px; margin-top: 10px; padding-top: 10px; }
  .post .pie { padding: 18px 60px 56px; }
  .post .pide { font-size: 44px; }
  .post .whatsapp { font-size: 40px; padding: 14px 28px 12px; margin-top: 8px; }
  .post .whatsapp svg { width: 42px; height: 42px; }
  .post .donde { font-size: 22px; margin-top: 14px; }
</style>
</head>
<body>
<div id="flier"></div>
<script src="flier-combos-datos.js"></script>
<script>
  const parametros = new URLSearchParams(location.search);
  const tipo = parametros.get("tipo") === "perros" ? "perros" : "hamburguesas";
  const formato = parametros.get("formato") === "post" ? "post" : "estado";
  const datos = window.DATOS_FLIER;
  const dinero = (n) => n.toLocaleString("es-VE", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const escapar = (t) => String(t).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
  const ICONO_WHATSAPP =
    '<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2Zm0 18.2a8.2 8.2 0 0 1-4.2-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2Zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8-.2-.1-.4-.1-.6.1l-.8 1c-.1.2-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.2-.4.2-.4.7-1.3.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.2 5.2 0 0 0 1.1 2.7 11.8 11.8 0 0 0 4.5 4c1.7.7 2.3.8 3.2.6.5-.1 1.5-.6 1.7-1.2.2-.6.2-1.1.2-1.2-.1-.1-.3-.2-.5-.3Z"/></svg>';

  const lado = datos[tipo];
  const tarjeta = (c) => `
    <article class="combo${c.premium ? " premium" : ""}">
      <div>
        <span class="insignia">${c.premium ? "★ PREMIUM" : "ARTESANAL"}</span>
        <div class="cuantas">${escapar(c.cuantas)}${c.nota ? `<small>${escapar(c.nota)}</small>` : ""}</div>
      </div>
      <div class="precio"><small>PRECIO</small><b>${dinero(c.precio)} $</b></div>
      <ul class="lleva">
        ${c.lleva.map((l) => `<li>${escapar(l)}</li>`).join("")}
        <li class="salsas">${escapar(c.salsas)}</li>
      </ul>
      <div class="cada">Sale a <b>${dinero(c.precio / c.unidades)} $</b> ${escapar(c.cadaUna)}</div>
    </article>`;

  document.getElementById("flier").outerHTML = `
    <main class="flier ${formato}">
      <header class="cabecera">
        <img src="../public/marca/leon.svg" alt="">
        <div>
          <div class="marca">VILLA REAL · AL MAYOR</div>
          <div class="titulo">COMBOS<span class="de">${escapar(lado.de)}</span></div>
        </div>
      </header>
      <div class="heroe ${tipo}">
        ${lado.fotos.map((f) => `<img src="${escapar(f.src)}" alt="" style="--alto: ${f.alto}">`).join("")}
        <div class="cinta"><small>CON SALSAS</small>¡Todo listo!</div>
      </div>
      <section class="combos">${lado.combos.map(tarjeta).join("")}</section>
      <footer class="pie">
        <div class="pide">¡Pídelo ya!</div>
        <div class="whatsapp">${ICONO_WHATSAPP}${escapar(datos.whatsapp)}</div>
        <div class="donde">${escapar(datos.direccion)}<br><span>Delivery a Barquisimeto y Cabudare</span></div>
      </footer>
    </main>`;
</script>
</body>
</html>
