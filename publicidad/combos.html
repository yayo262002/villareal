<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Cartel de combos · Villa Real</title>
<style>
  /* Las fuentes del proyecto (OFL) y el león, por ruta relativa: se abre desde esta carpeta. */
  @font-face { font-family: "Archivo Black"; src: url("../src/assets/fuentes/ArchivoBlack-Regular.ttf"); }
  @font-face { font-family: "Archivo"; src: url("../src/assets/fuentes/Archivo-Medium.ttf"); font-weight: 500; }

  /* El cartel mide 60 × 90 cm (lona o papel); todo va en milímetros, al tamaño real.
     Rojo sobre crema, como los carteles de charcutería (el dueño lo prefirió al verde y al negro). */
  @page { size: 600mm 900mm; margin: 0; }
  html, body { margin: 0; background: #888; }
  body { font-family: "Archivo", Arial, sans-serif; display: grid; gap: 20mm; padding: 20mm; justify-content: start; }

  .cartel {
    --fondo: #f6ead3; --cabecera: #b3231d; --titulo: #f6ead3; --oro: #e9b13a;
    --acento: #b3231d; --sobre-acento: #fff7e6;
    --tarjeta: #ffffff; --borde-tarjeta: #e4d4b4; --tinta: #1d1a17; --tinta-suave: #6b625a;
    --pie: #1d1a17; --pie-fuerte: #b3231d;
  }
  .cartel {
    position: relative; box-sizing: border-box; width: 600mm; height: 900mm; overflow: hidden;
    background: var(--fondo); color: var(--tinta);
    display: grid; grid-template-rows: auto 1fr; row-gap: 14mm; padding-bottom: 24mm;
  }

  /* La cabecera: una franja de color de lado a lado, con el león y los títulos, y una raya dorada debajo. */
  .cabecera {
    background: var(--cabecera); color: var(--titulo); border-bottom: 3.5mm solid var(--oro);
    display: grid; grid-template-columns: auto 1fr auto; align-items: center; column-gap: 18mm; padding: 13mm 30mm 12mm;
  }
  .cabecera img { width: 66mm; height: 95mm; display: block; }
  .marca { display: grid; gap: 3mm; }
  .marca .charcuteria { font-family: "Archivo Black"; font-size: 13mm; letter-spacing: 0.16em; text-transform: uppercase; color: var(--oro); line-height: 1; }
  .marca .nombre { font-family: "Archivo Black"; font-size: 34mm; line-height: 0.95; letter-spacing: -0.01em; }
  .marca .combos { font-family: "Archivo Black"; font-size: 50mm; line-height: 0.9; color: var(--oro); letter-spacing: 0.02em; margin-top: 2mm; }
  .marca .lema { font-size: 10.5mm; margin-top: 3mm; opacity: 0.9; }

  .lista { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); grid-auto-rows: 1fr; gap: 12mm; padding: 0 30mm; }
  .combo {
    position: relative; box-sizing: border-box; min-width: 0; background: var(--tarjeta); border: 0.8mm solid var(--borde-tarjeta); border-radius: 8mm;
    display: grid; grid-template-rows: 1fr auto; row-gap: 5mm; padding: 9mm 10mm 8mm;
  }
  .combo .numero {
    position: absolute; top: 7mm; left: 7mm; z-index: 2;
    width: 31mm; height: 31mm; border-radius: 50%; background: var(--acento); color: var(--sobre-acento);
    display: grid; place-content: center; place-items: center; font-family: "Archivo Black"; font-size: 15mm; line-height: 1;
  }
  .combo .numero small { font-size: 4.8mm; letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: -1.5mm; }

  /* Los productos, juntos como en una foto de producto: cada foto recortada al producto, todos a la misma
     escala (--cm es lo que mide de alto en la vida real; --mm-por-cm, la escala del cartel), apoyados en la
     misma línea y un poco solapados, el más pequeño delante. Si la pareja no cabe en la tarjeta, las fotos
     encogen sin estirar la tarjeta. Con los once combos en cuatro filas, la escala es menor que con nueve. */
  .cartel { --mm-por-cm: 2.1; }
  .combo .fotos { display: flex; justify-content: center; align-items: flex-end; gap: 0; min-height: 0; min-width: 0; padding: 4mm 0 0; }
  .combo .fotos img {
    height: calc(var(--cm, 30) * var(--mm-por-cm) * 1mm); width: auto; max-width: 104mm; min-width: 0;
    object-fit: contain; object-position: center bottom; display: block; position: relative; z-index: calc(100 - var(--cm, 30));
  }
  .combo .fotos img + img, .combo .fotos img + .falta, .combo .fotos .falta + img { margin-left: -12mm; }
  /* En algún combo el dueño quiere los dos productos un poco separados. */
  .combo--separado .fotos img + img { margin-left: 3mm; }
  /* Los combos con nombre propio (perrero, solidario) llevan tres cosas y un solo título. */
  .combo--tres .fotos img + img { margin-left: -7mm; }
  .combo--tres .producto { font-size: 11mm; color: var(--acento); }
  /* Y se distinguen de los demás, que son especiales: la tarjeta en rojo como la cabecera, el título en dorado,
     los productos sobre una bandeja blanca, el número en dorado y una cinta «Especial». */
  .combo--tres { background: var(--acento); border-color: var(--acento); color: var(--sobre-acento); }
  .combo--tres .fotos { background: var(--tarjeta); border-radius: 6mm; padding: 4mm 6mm 3mm; }
  .combo--tres .numero { background: var(--oro); color: var(--tinta); }
  .combo.combo--tres .producto { color: var(--oro); }
  .combo.combo--tres .detalle { color: var(--sobre-acento); }
  .combo.combo--tres .precio { border-color: var(--oro); }
  .combo--tres::after {
    content: "Especial"; position: absolute; top: 10mm; right: -0.8mm; z-index: 2;
    background: var(--oro); color: var(--tinta); font-family: "Archivo Black"; font-size: 6.5mm; letter-spacing: 0.14em; text-transform: uppercase;
    padding: 2.5mm 7mm 2.5mm 8mm; border-radius: 3mm 0 0 3mm;
  }

  /* Dónde se pide y cómo se paga, a la derecha de la cabecera (abajo no queda sitio con doce combos). */
  .pedidos { display: grid; justify-items: end; gap: 3mm; text-align: right; max-width: 200mm; }
  .pedidos .titulo { font-family: "Archivo Black"; font-size: 8mm; letter-spacing: 0.08em; text-transform: uppercase; color: var(--oro); line-height: 1.1; }
  .pedidos .numero-whatsapp { font-family: "Archivo Black"; font-size: 15mm; line-height: 1; }
  .pedidos .donde { font-size: 7mm; line-height: 1.3; }
  .pedidos .pagos { font-size: 7mm; line-height: 1.35; opacity: 0.9; }
  /* Mientras falte la foto de un producto, un hueco que lo dice. */
  .combo .fotos .falta {
    box-sizing: border-box; width: 40mm; height: 70mm; border: 0.8mm dashed var(--tinta-suave); border-radius: 4mm; background: var(--tarjeta); position: relative; z-index: 0;
    display: grid; place-items: center; text-align: center; font-size: 6mm; color: var(--tinta-suave); padding: 4mm; opacity: 0.7;
  }

  .combo .pie { display: grid; row-gap: 5mm; }
  .combo .que { display: grid; gap: 1.5mm; min-width: 0; }
  .combo .producto { font-family: "Archivo Black"; font-size: 10mm; line-height: 1.05; text-transform: uppercase; }
  .combo .detalle { font-size: 6.2mm; color: var(--tinta-suave); margin-top: 1.5mm; line-height: 1.3; }
  /* La casilla del precio va en blanco: se escribe con marcador y se cambia cuando cambia la tasa. */
  .combo .precio {
    box-sizing: border-box; width: 100%; height: 26mm; border: 1.3mm solid var(--acento); border-radius: 3.5mm; background: #fff;
    display: flex; align-items: center; padding: 0 5mm; gap: 3mm;
  }
  .combo .precio .bs { font-family: "Archivo Black"; font-size: 10mm; color: var(--acento); line-height: 1; }

</style>
</head>
<body>


<template id="cartel">
  <div class="cartel">
    <header class="cabecera">
      <img src="../public/marca/leon.svg" alt="">
      <div class="marca">
        <div class="charcuteria">Charcutería</div>
        <div class="nombre">Villa Real</div>
        <div class="combos">Combos</div>
        <div class="lema">Bandejas listas para la arepa, el sándwich y la pizza</div>
      </div>
      <div class="pedidos">
        <div class="titulo">Pedidos por WhatsApp</div>
        <div class="numero-whatsapp">0424-6343236</div>
        <div class="donde">Calle 38 entre carreras 30 y 31<br>sector Centro · Barquisimeto</div>
        <div class="pagos">Pago móvil · Efectivo · Zelle<br>Al mayor y al detal</div>
      </div>
    </header>
    <section class="lista"></section>
  </div>
</template>

<script src="combos-datos.js"></script>
<script>
  // El cartel se arma con los combos de combos-datos.js (los mismos de las hojas de cada combo), menos los que van solo en su
  // hoja; en tres columnas.
  const tarjetaDe = (combo) => {
    const clases = ["combo", combo.productos.length > 2 ? "combo--tres" : "", combo.separado ? "combo--separado" : ""].filter(Boolean).join(" ");
    const nombres = combo.titulo ? `<div class="producto">${combo.titulo}</div>` : combo.productos.map(([, nombre]) => `<div class="producto">${nombre}</div>`).join("");
    return `<article class="${clases}">
      <div class="numero"><small>Combo</small>${combo.n}</div>
      <div class="fotos">${combo.productos.map(([foto]) => fotoDe(foto)).join("")}</div>
      <div class="pie">
        <div class="que">${nombres}<div class="detalle">${combo.detalle.replace(/(\d) /g, "$1\u00a0")}</div></div>
        <div class="precio"><span class="bs">Bs</span></div>
      </div>
    </article>`;
  };
  const cartel = document.getElementById("cartel").content.firstElementChild.cloneNode(true);
  cartel.dataset.archivo = "combos-60x90";
  cartel.querySelector(".lista").innerHTML = COMBOS.filter((combo) => combo.cartel !== false).map(tarjetaDe).join("");
  document.body.append(cartel);
</script>
</body>
</html>
