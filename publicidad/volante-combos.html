<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Volante de los combos · Villa Real</title>
<style>
  /* Las fuentes del proyecto (OFL) y el león, por ruta relativa: se abre desde esta carpeta. */
  @font-face { font-family: "Archivo Black"; src: url("../src/assets/fuentes/ArchivoBlack-Regular.ttf"); }
  @font-face { font-family: "Open Sans"; src: url("fuentes/OpenSans.ttf"); font-weight: 300 800; font-stretch: 75% 100%; font-style: normal; }
  @font-face { font-family: "Kaushan Script"; src: url("fuentes/KaushanScript-Regular.ttf"); }

  /* El volante para darle a los clientes (el dueño, 16/11/2026: «lleve su combo charcutero, sin número telefónico pero sí
     dirección, que aparezcan todos»): media carta (139,7 × 215,9 mm), con los quince combos, su foto y lo que lleva cada
     uno, y la dirección de la charcutería abajo. Todo va en milímetros, al tamaño real. Es el diseño del flier del estado
     de WhatsApp (estado-combos.html), con los combos de combos-datos.js.
     Sale en dos versiones: sin precios (vale mientras no cambien los combos) y con los precios de hoy, de combos-precios.js,
     que escribe npm run combos (esa no va al repositorio: los precios cambian con los costos). Y cada una en una hoja carta
     acostada con dos volantes, para imprimir y cortar por la mitad. */
  html, body { margin: 0; background: #888; }
  body { font-family: "Open Sans", Arial, sans-serif; display: grid; gap: 10mm; padding: 10mm; justify-content: start; }

  .volante {
    --rojo: #b3231d; --rojo-oscuro: #7c0a10; --oro: #e9b13a; --oro-claro: #f6d779; --crema: #fbf3e2; --tinta: #1f1612; --tinta-suave: #6b5d55;
    position: relative; box-sizing: border-box; width: 139.7mm; height: 215.9mm; overflow: hidden; background: var(--crema); color: var(--tinta);
    display: grid; grid-template-rows: auto minmax(0, 1fr) auto;
  }

  /* La cabecera roja con el león y «¡Lleve su COMBO charcutero!»: «COMBO» grande, y lo demás en letra de mano. */
  .cabecera {
    position: relative; background: radial-gradient(ellipse 80% 120% at 30% 20%, #c8141c, #a50d14 55%, #7d080d); color: var(--crema);
    border-bottom: 1.6mm solid var(--oro); padding: 3.8mm 6mm 3.4mm; display: grid; grid-template-columns: auto minmax(0, 1fr); column-gap: 4.5mm; align-items: center;
  }
  .cabecera img { width: 21mm; height: 30.2mm; display: block; filter: drop-shadow(0 1mm 1.4mm rgba(40, 5, 0, 0.35)); }
  .frase { display: grid; justify-items: start; min-width: 0; }
  .lleve { font-family: "Kaushan Script", cursive; font-size: 9.5mm; line-height: 1; color: var(--oro-claro); margin-left: 1mm; margin-bottom: -1.2mm; position: relative; z-index: 1; }
  .combo-grande { font-family: "Archivo Black"; font-size: 24mm; line-height: 0.86; letter-spacing: 0.01em; text-shadow: 0 0.9mm 0 #6a060b; white-space: nowrap; }
  .charcutero { justify-self: end; font-family: "Kaushan Script", cursive; font-size: 10.5mm; line-height: 1; color: var(--oro-claro); margin-top: -2.4mm; }

  /* Los combos, en cuatro columnas y cuatro filas: así cada tarjeta es más alta que ancha, como los productos, y las fotos
     salen más grandes que en tres columnas (con tres, en la versión con precios casi no se veían). La cuadrícula tiene ocho
     columnas y cada combo ocupa dos: si la última fila no se llena, sus combos van al centro. */
  .combos { display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); grid-template-rows: repeat(var(--filas, 4), minmax(0, 1fr)); gap: 2.4mm; padding: 3.4mm 3.4mm 3mm; min-height: 0; }
  .combo {
    position: relative; min-width: 0; min-height: 0; grid-column: span 2; box-sizing: border-box; background: #ffffff; border: 0.45mm solid #ead9b6; border-radius: 3.4mm;
    display: grid; grid-template-rows: minmax(0, 1fr) auto auto; padding: 1.4mm 1.4mm 1.5mm; box-shadow: 0 0.6mm 1.4mm rgba(90, 50, 10, 0.12);
  }
  .numero {
    position: absolute; top: -0.7mm; left: -0.7mm; z-index: 3; width: 8.6mm; height: 8.6mm; border-radius: 50%; background: var(--rojo); color: var(--crema);
    display: grid; place-content: center; text-align: center; font-family: "Archivo Black"; font-size: 4.1mm; line-height: 0.9; border: 0.5mm solid var(--oro); box-sizing: border-box;
  }
  .numero small { display: block; font-size: 1.25mm; letter-spacing: 0.1em; }
  .fotos { position: relative; z-index: 1; display: flex; justify-content: center; align-items: flex-end; column-gap: 1mm; min-height: 0; padding-top: 1mm; overflow: hidden; }
  .fotos img { height: calc(var(--cm, 30) * var(--mm-por-cm, 0.8) * 1mm); width: auto; max-width: 62%; min-width: 0; object-fit: contain; object-position: center bottom; position: relative; z-index: calc(100 - var(--cm, 30)); }
  .combo--tres .fotos img { max-width: 44%; }
  .nombre { margin-top: 1mm; text-align: center; font-weight: 800; font-size: 2.85mm; line-height: 1.08; color: var(--tinta); text-wrap: balance; }
  .titulo { display: block; }
  .detalle { display: block; margin-top: 0.4mm; font-weight: 600; font-size: 2.1mm; line-height: 1.15; color: var(--tinta-suave); }
  .precio {
    justify-self: center; margin-top: 1mm; padding: 0.1mm 3mm 0.4mm; border-radius: 999px; background: linear-gradient(180deg, #f9dd86, #edbb49 55%, #cf961f);
    border: 0.3mm solid #a8740f; font-family: "Archivo Black"; font-size: 4.6mm; line-height: 1.15; color: var(--rojo-oscuro);
  }
  .precio small { font-size: 3mm; }
  /* Los especiales, en rojo, como en el cartel grande y en el flier. */
  .combo--especial { background: linear-gradient(180deg, #c3161d, #8a090f); border-color: var(--oro); }
  .combo--especial .numero { background: var(--oro); color: var(--rojo-oscuro); border-color: #ffffff; }
  .combo--especial .fotos { background: #ffffff; border-radius: 2.2mm; padding: 1mm 0.8mm 0.5mm; }
  .combo--especial .nombre { color: var(--oro-claro); }
  .combo--especial .detalle { color: #fbe3c8; }
  .combo--especial .precio { background: #ffffff; border-color: var(--oro); }
  .cinta { position: absolute; top: 1.5mm; right: -0.45mm; z-index: 3; background: var(--oro); color: var(--rojo-oscuro); font-family: "Archivo Black"; font-size: 1.7mm; letter-spacing: 0.14em; padding: 0.6mm 1.4mm 0.6mm 1.7mm; border-radius: 1mm 0 0 1mm; }

  /* Abajo, quién y dónde: sin teléfono, como pidió el dueño. */
  .pie { background: var(--rojo); color: var(--crema); border-top: 1.2mm solid var(--oro); padding: 2.6mm 5mm 3mm; display: grid; justify-items: center; gap: 0.8mm; text-align: center; }
  .pie .quien { font-family: "Archivo Black"; font-size: 4.4mm; letter-spacing: 0.12em; text-transform: uppercase; color: var(--oro); line-height: 1.05; }
  .pie .donde { display: flex; align-items: center; gap: 1.4mm; font-size: 3.5mm; font-weight: 700; line-height: 1.2; }
  .pie .donde svg { width: 3.4mm; height: 4.4mm; flex: none; }
  .pie .letra-chica { font-size: 2.4mm; font-weight: 600; line-height: 1.2; opacity: 0.92; }

  /* La hoja carta acostada con dos volantes, para imprimir en cualquier impresora y cortar por la raya de la mitad: cada
     volante un poco más pequeño (el 93 %), para que la impresora no le coma los bordes. */
  .hoja-doble { position: relative; width: 279.4mm; height: 215.9mm; background: #ffffff; overflow: hidden; display: grid; grid-template-columns: 1fr 1fr; }
  .hoja-doble .mitad { position: relative; width: 139.7mm; height: 215.9mm; }
  .hoja-doble .volante { position: absolute; inset: 0; transform: scale(0.93); transform-origin: center; }
  .hoja-doble::after { content: ""; position: absolute; top: 0; bottom: 0; left: 50%; border-left: 0.3mm dashed #9a9a9a; }
</style>
</head>
<body>
<script src="combos-datos.js"></script>
<script src="combos-precios.js"></script>
<script>
  document.head.insertAdjacentHTML("beforeend", `<style>${ESTILO_DEL_GRUPO}</style>`);
  const PRECIOS = globalThis.COMBOS_PRECIOS ?? null;
  const dolares = (n) => n.toFixed(2).replace(".", ",");
  /** El nombre corto de cada combo: los productos, o el nombre propio de los especiales. */
  const nombreDe = (c) => (c.titulo ? c.titulo : c.productos.map(([, nombre], i) => (i === 0 ? nombre : nombre.charAt(0).toLowerCase() + nombre.slice(1))).join(" + "));
  // Sin cortar entre el número y su unidad («200 g», «6 huevos»).
  const detalleDe = (c) => c.detalle.replace("de cada producto", "de cada uno").replace(/(\d) /g, "$1 ");
  // La chincheta del mapa, dibujada: el volante no lleva el teléfono, lleva dónde está la tienda.
  const CHINCHETA = `<svg viewBox="0 0 24 32" aria-hidden="true"><path fill="#e9b13a" d="M12 0C5.4 0 0 5.3 0 11.9 0 20.8 12 32 12 32s12-11.2 12-20.1C24 5.3 18.6 0 12 0zm0 17a5.2 5.2 0 1 1 0-10.4A5.2 5.2 0 0 1 12 17z"/></svg>`;

  /** Un volante: con los precios de hoy o sin ellos. */
  function volante(archivo, conPrecios) {
    const v = document.createElement("article");
    v.className = "volante";
    v.dataset.archivo = archivo;
    v.dataset.formato = "jpeg";
    v.dataset.ppp = "300";
    v.innerHTML = `
      <header class="cabecera">
        <img src="../public/marca/leon.svg" alt="">
        <div class="frase"><div class="lleve">¡Lleve su</div><div class="combo-grande">COMBO</div><div class="charcutero">charcutero!</div></div>
      </header>
      <main class="combos" style="--filas: ${Math.ceil(COMBOS.length / 4)}">
        ${COMBOS.map((c) => {
          const clases = ["combo", c.especial ? "combo--especial" : "", c.productos.length === 3 ? "combo--tres" : ""].filter(Boolean).join(" ");
          const precio = conPrecios ? PRECIOS.precios[c.n] : null;
          return `<article class="${clases}">
            <div class="numero"><small>COMBO</small>${c.n}</div>
            ${c.especial ? `<div class="cinta">ESPECIAL</div>` : ""}
            <div class="fotos">${c.grupo ? grupoDe(c) : c.productos.map(([foto]) => fotoDe(foto, c)).join("")}</div>
            <div class="nombre"><span class="titulo">${nombreDe(c)}</span><span class="detalle">${detalleDe(c)}</span></div>
            ${conPrecios ? `<div class="precio">${precio ? `<small>$</small>${dolares(precio)}` : "<small>Consulte</small>"}</div>` : ""}
          </article>`;
        }).join("")}
      </main>
      <footer class="pie">
        <div class="quien">Charcutería Villa Real</div>
        <div class="donde">${CHINCHETA}<span>Calle 38 entre carreras 30 y 31, sector Centro · Barquisimeto</span></div>
        ${conPrecios ? `<div class="letra-chica">Precios en dólares del ${PRECIOS.fechaCorta} · se pagan en bolívares a la tasa BCV del día</div>` : ""}
      </footer>`;
    // Si la última fila no se llena, sus combos van al centro: el primero de ella empieza media tarjeta más a la derecha
    // por cada una que falta.
    const sobran = COMBOS.length % 4;
    if (sobran > 0) v.querySelectorAll(".combo")[COMBOS.length - sobran].style.gridColumn = `${1 + 4 - sobran} / span 2`;
    return v;
  }

  const volantes = [volante("volante-combos", false)];
  // Con precios, solo si npm run combos ya los sacó (combos-precios.js no va al repositorio).
  if (PRECIOS) volantes.push(volante("volante-combos-precios", true));
  document.body.append(...volantes);

  /** «COMBO» llena el ancho de su columna: con la letra que quepa, ni más ni menos. */
  function llenarAncho(el) {
    const ancho = el.parentElement.getBoundingClientRect().width;
    const tam = parseFloat(getComputedStyle(el).fontSize);
    el.style.fontSize = `${(tam * ancho) / el.getBoundingClientRect().width}px`;
  }

  // Que cada combo quepa en su tarjeta: si las fotos, el nombre y el precio se pasan, las fotos encogen lo justo.
  window.listo = false;
  Promise.all([document.fonts.ready, ...[...document.querySelectorAll("img")].map((i) => (i.complete ? null : new Promise((r) => (i.onload = i.onerror = r))))]).then(() => {
    for (const v of volantes) {
      v.querySelector(".combo-grande").style.display = "inline-block";
      llenarAncho(v.querySelector(".combo-grande"));
      for (const combo of v.querySelectorAll(".combo")) {
        // El nombre, en tres renglones como mucho (el de un especial, en uno): si no cabe, su letra baja un poco.
        const titulo = combo.querySelector(".titulo");
        const renglones = combo.classList.contains("combo--especial") ? 1 : 3;
        const alto = () => titulo.getBoundingClientRect().height / parseFloat(getComputedStyle(titulo).lineHeight);
        let letra = parseFloat(getComputedStyle(titulo).fontSize);
        while (alto() > renglones + 0.5 && letra > 9) {
          letra -= 0.2;
          titulo.style.fontSize = `${letra}px`;
        }
        const caja = combo.querySelector(".fotos");
        const mm = 96 / 25.4; // un milímetro, en píxeles
        const pasa = () => {
          const c = caja.getBoundingClientRect();
          // Ni por arriba ni por los lados; ni debajo del número del combo, ni, en los especiales, de la cinta «Especial».
          const cinta = combo.querySelector(".cinta")?.getBoundingClientRect();
          const numero = combo.querySelector(".numero").getBoundingClientRect();
          return [...caja.querySelectorAll("img")].some((i) => {
            const f = i.getBoundingClientRect();
            return (
              f.top < c.top + 0.5 * mm ||
              f.left < c.left - 1 ||
              f.right > c.right + 1 ||
              (f.left < numero.right && f.top < numero.bottom) ||
              (cinta && f.right > cinta.left - 0.5 * mm && f.top < cinta.bottom + 0.5 * mm)
            );
          });
        };
        // El combo de recortes: la escena entera, lo más grande que cabe en su caja, y se achica igual si algo choca.
        const grupo = caja.querySelector(".grupo");
        if (grupo) {
          const c = caja.getBoundingClientRect();
          const [ancho, alto] = grupo.style.aspectRatio.split("/").map(Number);
          let px = Math.min(c.width, ((c.height - parseFloat(getComputedStyle(caja).paddingTop) - 3) * ancho) / alto);
          grupo.style.width = `${px}px`;
          while (pasa() && px > 10) {
            px *= 0.98;
            grupo.style.width = `${px}px`;
          }
          continue;
        }
        // Se empieza grande y se achica hasta que quepa.
        let escala = 1.2;
        combo.style.setProperty("--mm-por-cm", escala.toFixed(2));
        while (pasa() && escala > 0.2) {
          escala -= 0.01;
          combo.style.setProperty("--mm-por-cm", escala.toFixed(2));
        }
      }
    }
    // Y cada volante, dos veces en una hoja carta acostada, para cortar por la mitad.
    for (const v of volantes) {
      const hoja = document.createElement("div");
      hoja.className = "hoja-doble";
      hoja.dataset.archivo = `${v.dataset.archivo}-2-por-hoja`;
      hoja.dataset.solo = "pdf";
      for (let i = 0; i < 2; i++) {
        const mitad = document.createElement("div");
        mitad.className = "mitad";
        const copia = v.cloneNode(true);
        delete copia.dataset.archivo;
        mitad.append(copia);
        hoja.append(mitad);
      }
      document.body.append(hoja);
    }
    window.listo = true;
  });
</script>
</body>
</html>
