<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Flier de los combos del burger (mezcla) · Villa Real</title>
<style>
  /* El flier de los combos que el dueño armó con ChatGPT (25/11/2026: «hazme una mezcla donde aparezcan todos los
     productos»), rehecho aquí con sus textos correctos: el título blanco con relieve y «de Hamburguesas» en amarillo, las
     hamburguesas a los lados, todos los productos del combo en el centro, la etiqueta roja del precio, la franja amarilla
     del delivery y el león de la marca (el de verdad, no el que dibujó ChatGPT). Las hamburguesas y el pan Brioche salen
     de sus imágenes; lo demás, de las fotos de la mercancía. ?tipo=hamburguesas|perros. 1080 × 1920. Los datos, de
     flier-combos-datos.js (los escribe flier-combos-burger.mjs). */
  @font-face { font-family: "Archivo Black"; src: url("../src/assets/fuentes/ArchivoBlack-Regular.ttf"); }
  @font-face { font-family: "Open Sans"; src: url("fuentes/OpenSans.ttf"); font-weight: 300 800; font-stretch: 75% 100%; font-style: normal; }
  @font-face { font-family: "Open Sans"; src: url("fuentes/OpenSans-Italic.ttf"); font-weight: 300 800; font-style: italic; }
  @font-face { font-family: "Kaushan Script"; src: url("fuentes/KaushanScript-Regular.ttf"); }

  html, body { margin: 0; padding: 0; background: #4a0406; }
  * { box-sizing: border-box; }
  .flier {
    --rojo: #d6141c; --rojo-hondo: #7d080d; --vino: #4a0406; --amarillo: #ffd21a; --amarillo-hondo: #f2a20c; --crema: #fff8ea; --tinta: #231511;
    position: relative; width: 1080px; height: 1920px; overflow: hidden; isolation: isolate; font-family: "Open Sans", Arial, sans-serif; color: var(--tinta);
    background: radial-gradient(ellipse 85% 55% at 50% 30%, #f0262a 0%, #c9121a 42%, #8a0a10 78%, #5c0508 100%);
  }
  .flier::before {
    content: ""; position: absolute; inset: -50%; z-index: -1; opacity: 0.55;
    background: repeating-conic-gradient(from 3deg at 50% 36%, rgba(255, 190, 120, 0.2) 0deg 6deg, transparent 6deg 16deg);
  }
  .flier::after { content: ""; position: absolute; inset: 0; z-index: -1; background: radial-gradient(ellipse 70% 40% at 50% 45%, rgba(255, 170, 60, 0.25), transparent 70%); }

  /* Arriba. */
  .cabecera { position: relative; height: 348px; }
  .leon { position: absolute; left: 40px; top: 30px; width: 150px; filter: drop-shadow(0 8px 10px rgba(40, 0, 0, 0.55)); }
  .banda {
    position: absolute; left: 250px; top: 30px; padding: 10px 32px 8px; background: var(--amarillo); color: var(--vino); font-family: "Archivo Black"; font-size: 36px;
    letter-spacing: 0.04em; clip-path: polygon(2% 8%, 98% 0, 100% 88%, 3% 100%, 0 50%); transform: rotate(-2deg);
  }
  .combos {
    position: absolute; left: 0; right: 0; top: 74px; text-align: center; padding-left: 170px; font-family: "Archivo Black"; font-size: 162px; line-height: 1;
    color: #ffffff; -webkit-text-stroke: 14px var(--rojo-hondo); paint-order: stroke fill; letter-spacing: -0.01em;
    text-shadow: 0 6px 0 var(--amarillo-hondo), 0 14px 0 var(--vino), 0 22px 26px rgba(30, 0, 0, 0.55);
  }
  .de {
    position: absolute; left: 0; right: 0; top: 214px; text-align: center; padding-left: 60px; font-family: "Kaushan Script", cursive; font-size: 112px; line-height: 1;
    color: var(--amarillo); -webkit-text-stroke: 10px var(--vino); paint-order: stroke fill; text-shadow: 0 8px 0 var(--vino), 0 16px 20px rgba(30, 0, 0, 0.5); transform: rotate(-3deg);
  }
  .subrayado { position: absolute; left: 240px; top: 322px; width: 700px; height: 40px; }

  /* Los productos: las hamburguesas a los lados y el combo en el centro, de pie sobre la misma línea. */
  .heroe { position: relative; height: 372px; }
  .heroe img { position: absolute; display: block; filter: drop-shadow(0 18px 18px rgba(40, 0, 0, 0.55)); }
  .heroe .lado { bottom: 40px; height: 318px; z-index: 1; }
  .heroe .izq { left: -70px; }
  .heroe .der { right: -60px; }
  .heroe .p { z-index: 2; }
  .destellos { position: absolute; z-index: 0; }

  .cinta {
    position: absolute; left: 50%; bottom: -46px; z-index: 5; transform: translateX(-50%) rotate(-4deg); background: var(--amarillo); padding: 12px 40px 14px; text-align: center;
    clip-path: polygon(3% 10%, 97% 0, 100% 92%, 2% 100%, 0 55%); filter: drop-shadow(0 10px 8px rgba(40, 0, 0, 0.45)); white-space: nowrap;
  }
  .cinta small { display: block; font-family: "Archivo Black"; font-size: 34px; letter-spacing: 0.02em; color: var(--vino); line-height: 1; }
  .cinta b { display: block; font-family: "Kaushan Script", cursive; font-weight: 400; font-size: 58px; line-height: 1.05; color: var(--rojo); }

  /* Los dos combos. */
  .lista { position: relative; z-index: 3; display: grid; gap: 14px; padding: 20px 46px 0; }
  .combo {
    position: relative; display: grid; grid-template-columns: 1fr 318px; column-gap: 14px; padding: 14px 28px 12px; background: var(--crema); border: 7px solid var(--amarillo);
    border-radius: 34px; box-shadow: 0 0 0 4px var(--rojo-hondo), 0 16px 26px rgba(30, 0, 0, 0.5);
  }
  .insignia {
    display: inline-flex; align-items: center; gap: 10px; padding: 8px 26px 8px 22px; border-radius: 999px; background: linear-gradient(180deg, #ee2a2a, #b10e14); color: #ffffff;
    font-family: "Archivo Black"; font-size: 30px; line-height: 1; box-shadow: 0 4px 0 var(--rojo-hondo); transform: rotate(-2deg); justify-self: start;
  }
  .premium .insignia { background: linear-gradient(180deg, #9d0c12, #66050a); }
  .insignia i { font-style: normal; display: inline-grid; place-items: center; width: 44px; height: 44px; margin-left: -8px; border-radius: 50%; background: var(--amarillo); color: var(--rojo-hondo); font-size: 30px; }
  .cuantas { margin-top: 8px; font-family: "Archivo Black"; font-size: 56px; line-height: 1; color: var(--rojo); text-shadow: 0 4px 0 #f3c5b8; white-space: nowrap; }
  .cuantas small { display: block; margin-top: 4px; font-family: "Open Sans"; font-weight: 800; font-size: 25px; color: var(--tinta); text-shadow: none; }
  .precio {
    position: relative; align-self: start; margin-top: 26px; padding: 24px 10px 12px; text-align: center; border-radius: 26px; border: 6px solid var(--amarillo);
    background: radial-gradient(ellipse at 50% 20%, #f2262c, #b50d14 70%, #8a0a10); box-shadow: 0 8px 0 var(--rojo-hondo), 0 14px 18px rgba(30, 0, 0, 0.45); transform: rotate(-2deg);
  }
  .precio small {
    position: absolute; left: 50%; top: -28px; transform: translateX(-50%); background: var(--amarillo); color: var(--vino); font-family: "Archivo Black"; font-size: 30px;
    padding: 6px 26px 4px; border-radius: 999px; white-space: nowrap;
  }
  .precio b {
    display: block; font-family: "Archivo Black"; font-weight: 400; font-size: 74px; line-height: 1; color: #ffffff; white-space: nowrap; letter-spacing: -0.02em;
    -webkit-text-stroke: 6px var(--vino); paint-order: stroke fill; text-shadow: 0 6px 0 var(--vino);
  }
  .precio b span { font-size: 46px; }
  .lleva { grid-column: 1 / -1; list-style: none; margin: 10px 0 0; padding: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 6px 16px; }
  .lleva li { position: relative; padding-left: 42px; font-weight: 700; font-size: 25px; line-height: 1.16; }
  .lleva li::before {
    content: "✓"; position: absolute; left: 0; top: 0; width: 32px; height: 32px; border-radius: 50%; background: linear-gradient(180deg, #ffe066, var(--amarillo-hondo));
    color: var(--vino); font-weight: 800; font-size: 21px; line-height: 32px; text-align: center; box-shadow: 0 2px 0 #b0700a;
  }
  .lleva li.salsas { grid-column: 1 / -1; color: var(--rojo); font-style: italic; font-weight: 800; }
  .cada {
    grid-column: 1 / -1; justify-self: center; margin-top: 8px; padding: 6px 30px; border-radius: 999px; background: linear-gradient(180deg, #ffe45c, var(--amarillo) 55%, #f5b80f);
    font-family: "Open Sans"; font-weight: 800; font-size: 27px; color: var(--tinta); box-shadow: 0 4px 0 #c98a07; white-space: nowrap;
  }
  .cada b { font-family: "Archivo Black"; font-weight: 400; font-size: 33px; color: var(--rojo); }
  .chispas { position: absolute; width: 60px; height: 70px; }
  .chispas.izq { left: -38px; bottom: 40px; transform: scaleX(-1); }
  .chispas.der { right: -38px; bottom: 40px; }

  /* Abajo. */
  .pie { position: absolute; left: 0; right: 0; bottom: 0; height: 338px; text-align: center; }
  .pide {
    position: relative; display: inline-block; margin-top: 0; font-family: "Kaushan Script", cursive; font-size: 80px; line-height: 1; color: #ffffff; -webkit-text-stroke: 9px var(--vino);
    paint-order: stroke fill; text-shadow: 0 6px 0 var(--vino); transform: rotate(-3deg);
  }
  .whatsapp {
    display: inline-flex; align-items: center; gap: 18px; margin-top: 8px; padding: 14px 46px 14px 30px; border-radius: 999px; border: 5px solid #ffffff;
    background: linear-gradient(180deg, #4be37a, #18b24c 55%, #0e8d3a); color: #ffffff; font-family: "Archivo Black"; font-size: 62px; line-height: 1;
    box-shadow: 0 8px 0 #0a6e2c, 0 16px 20px rgba(20, 0, 0, 0.45); text-shadow: 0 3px 0 #0a6e2c;
  }
  .whatsapp svg { width: 60px; height: 60px; }
  .donde { display: flex; justify-content: center; align-items: center; gap: 12px; margin-top: 10px; color: #ffffff; font-weight: 800; font-size: 32px; text-shadow: 0 2px 4px rgba(0, 0, 0, 0.45); }
  .donde svg { width: 40px; height: 52px; flex: none; }
  .delivery {
    position: absolute; left: 0; right: 0; bottom: 14px; height: 80px; display: flex; justify-content: center; align-items: center; gap: 22px; background: var(--amarillo);
    clip-path: polygon(0 18%, 100% 0, 100% 82%, 0 100%); color: var(--tinta); font-family: "Open Sans"; font-style: italic; font-weight: 800; font-size: 42px;
  }
  .delivery svg { width: 110px; height: 70px; }
</style>
</head>
<body>
<div id="flier"></div>
<script src="flier-combos-datos.js"></script>
<script>
  const parametros = new URLSearchParams(location.search);
  const tipo = parametros.get("tipo") === "perros" ? "perros" : "hamburguesas";
  const datos = window.DATOS_FLIER;
  const lado = datos[tipo];
  const dinero = (n) => n.toLocaleString("es-VE", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const escapar = (t) => String(t).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
  const WHATSAPP = '<svg viewBox="0 0 24 24"><path fill="currentColor" d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2Zm0 18.2a8.2 8.2 0 0 1-4.2-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2Zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8-.2-.1-.4-.1-.6.1l-.8 1c-.1.2-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.2-.4.2-.4.7-1.3.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.2 5.2 0 0 0 1.1 2.7 11.8 11.8 0 0 0 4.5 4c1.7.7 2.3.8 3.2.6.5-.1 1.5-.6 1.7-1.2.2-.6.2-1.1.2-1.2-.1-.1-.3-.2-.5-.3Z"/></svg>';
  const PIN = '<svg viewBox="0 0 30 40"><path d="M15 0C7 0 1 6 1 14c0 10 14 26 14 26s14-16 14-26C29 6 23 0 15 0Z" fill="#ffd21a" stroke="#4a0406" stroke-width="2"/><circle cx="15" cy="14" r="5.5" fill="#4a0406"/></svg>';
  const MOTO = '<svg viewBox="0 0 110 70" fill="#231511"><path d="M0 30h24M6 40h20M12 50h14" stroke="#231511" stroke-width="5" stroke-linecap="round"/><circle cx="40" cy="56" r="11" fill="none" stroke="#231511" stroke-width="6"/><circle cx="92" cy="56" r="11" fill="none" stroke="#231511" stroke-width="6"/><path d="M36 52h30l10-16h14l6 14"/><rect x="38" y="22" width="24" height="20" rx="3"/><circle cx="74" cy="12" r="7"/><path d="M66 22h14l4 14H70Z"/></svg>';
  const CHISPAS = '<svg class="chispas LADO" viewBox="0 0 60 70"><path d="M8 34 54 20M10 46 52 50M8 22 40 4M12 58 38 68" stroke="#e0141c" stroke-width="7" stroke-linecap="round"/></svg>';
  const DESTELLOS = '<svg class="destellos" style="left:160px;top:-10px;width:760px;height:300px" viewBox="0 0 760 300"><g stroke="#ffffff" stroke-width="9" stroke-linecap="round" opacity="0.9"><path d="M120 120 150 160M90 190 140 200M140 60 165 110"/><path d="M640 120 610 160M670 190 620 200M620 60 595 110"/></g></svg>';

  // Los productos del combo, en grupo: lo alto atrás y lo ancho delante. [foto, izquierda, alto, abajo, giro, delante]
  const GRUPOS = {
    hamburguesas: [
      ["pan-hamburguesa.png", 300, 300, 40, 0, false],
      ["big-cola.png", 600, 330, 40, 4, false],
      ["pepsi.png", 690, 312, 40, 8, false],
      ["queso-amarillo.png", 210, 262, 30, -10, true],
      ["carne-hot-burger.png", 380, 175, 30, -4, true],
      ["papas-ralladas.png", 560, 205, 30, 6, true],
    ],
    perros: [
      ["pan-perro.png", 300, 300, 40, 0, false],
      ["big-cola.png", 600, 330, 40, 4, false],
      ["pepsi.png", 690, 312, 40, 8, false],
      ["salchichas.png", 170, 165, 30, -6, true],
      ["papas-ralladas.png", 560, 205, 30, 6, true],
    ],
  };
  const productos = GRUPOS[tipo]
    .map(([f, x, alto, abajo, giro, delante]) => `<img class="p" src="fotos/${f}" alt="" style="left:${x}px;height:${Math.round(alto * 0.88)}px;bottom:${abajo}px;transform:rotate(${giro}deg);z-index:${delante ? 3 : 2}">`)
    .join("");
  const lados = tipo === "hamburguesas" ? '<img class="lado izq" src="fotos/hamburguesa-izquierda.png" alt=""><img class="lado der" src="fotos/hamburguesa-derecha.png" alt="">' : "";

  const precio = (n) => { const [e, d] = dinero(n).split(","); return `${e},${d}<span> $</span>`; };
  const tarjeta = (c) => `
    <article class="combo${c.premium ? " premium" : ""}">
      <div>
        <span class="insignia">${c.premium ? "<i>★</i>PREMIUM" : "ARTESANAL"}</span>
        <div class="cuantas">${escapar(c.cuantas)}${c.nota ? `<small>${escapar(c.nota)}</small>` : ""}</div>
      </div>
      <div class="precio"><small>PRECIO</small><b>${precio(c.precio)}</b></div>
      <ul class="lleva">${c.lleva.map((l) => `<li>${escapar(l)}</li>`).join("")}<li class="salsas">${escapar(c.salsas)}</li></ul>
      <div class="cada">Sale a <b>${dinero(c.precio / c.unidades)} $</b> ${escapar(c.cadaUna)}</div>
      ${CHISPAS.replace("LADO", "izq")}${CHISPAS.replace("LADO", "der")}
    </article>`;

  document.getElementById("flier").outerHTML = `
    <main class="flier">
      <header class="cabecera">
        <img class="leon" src="../public/marca/leon.svg" alt="">
        <div class="banda">VILLA REAL • AL MAYOR</div>
        <div class="combos">COMBOS</div>
        <div class="de">${tipo === "hamburguesas" ? "de Hamburguesas" : "de Perros Calientes"}</div>
        <svg class="subrayado" viewBox="0 0 700 40"><path d="M10 30 C 200 6, 480 4, 690 18" stroke="#ffd21a" stroke-width="12" fill="none" stroke-linecap="round"/><path d="M10 30 C 200 6, 480 4, 690 18" stroke="#4a0406" stroke-width="4" fill="none" stroke-linecap="round" transform="translate(0 9)" opacity="0.6"/></svg>
      </header>
      <section class="heroe">
        ${DESTELLOS}${lados}${productos}
        <div class="cinta"><small>CON SALSAS</small><b>¡Todo listo!</b></div>
      </section>
      <section class="lista">${lado.combos.map(tarjeta).join("")}</section>
      <footer class="pie">
        <div class="pide">¡Pídelo ya!</div><br>
        <div class="whatsapp">${WHATSAPP}${escapar(datos.whatsapp)}</div>
        <div class="donde">${PIN}${escapar(datos.direccion)}</div>
        <div class="delivery">${MOTO}Delivery a Barquisimeto y Cabudare</div>
      </footer>
    </main>`;
</script>
</body>
</html>
