<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Cartel de combos · Villa Real</title>
<style>
  /* Las fuentes del proyecto (OFL) y el león, por ruta relativa: se abre desde esta carpeta. */
  @font-face { font-family: "Archivo Black"; src: url("../src/assets/fuentes/ArchivoBlack-Regular.ttf"); }
  @font-face { font-family: "Archivo"; src: url("../src/assets/fuentes/Archivo-Medium.ttf"); font-weight: 500; }

  /* El cartel mide 60 × 90 cm (lona o papel); todo va en milímetros, al tamaño real.
     Está dos veces, en dos colores (rojo sobre crema y negro con dorado): generar.mjs saca cada uno. */
  @page { size: 600mm 900mm; margin: 0; }
  html, body { margin: 0; background: #888; }
  body { font-family: "Archivo", Arial, sans-serif; display: grid; gap: 20mm; padding: 20mm; justify-content: start; }

  .cartel--rojo {
    --fondo: #f6ead3; --cabecera: #b3231d; --titulo: #f6ead3; --oro: #e9b13a;
    --acento: #b3231d; --sobre-acento: #fff7e6;
    --tarjeta: #ffffff; --borde-tarjeta: #e4d4b4; --tinta: #1d1a17; --tinta-suave: #6b625a;
    --pie: #1d1a17; --pie-fuerte: #b3231d;
  }
  .cartel--negro {
    --fondo: #171513; --cabecera: #171513; --titulo: #f6ead3; --oro: #e3a91f;
    --acento: #e3a91f; --sobre-acento: #171513;
    --tarjeta: #ffffff; --borde-tarjeta: transparent; --tinta: #1d1a17; --tinta-suave: #6b625a;
    --pie: #f6ead3; --pie-fuerte: #e3a91f;
  }
  .cartel {
    position: relative; box-sizing: border-box; width: 600mm; height: 900mm; overflow: hidden;
    background: var(--fondo); color: var(--tinta);
    display: grid; grid-template-rows: auto 1fr auto; row-gap: 14mm; padding-bottom: 20mm;
  }

  /* La cabecera: una franja de color de lado a lado, con el león y los títulos, y una raya dorada debajo. */
  .cabecera {
    background: var(--cabecera); color: var(--titulo); border-bottom: 3.5mm solid var(--oro);
    display: grid; grid-template-columns: auto 1fr; align-items: center; column-gap: 20mm; padding: 18mm 30mm 16mm;
  }
  .cabecera img { width: 78mm; height: 112mm; display: block; }
  .marca { display: grid; gap: 3mm; }
  .marca .charcuteria { font-family: "Archivo Black"; font-size: 13mm; letter-spacing: 0.16em; text-transform: uppercase; color: var(--oro); line-height: 1; }
  .marca .nombre { font-family: "Archivo Black"; font-size: 38mm; line-height: 0.95; letter-spacing: -0.01em; }
  .marca .combos { font-family: "Archivo Black"; font-size: 58mm; line-height: 0.9; color: var(--oro); letter-spacing: 0.02em; margin-top: 2mm; }
  .marca .lema { font-size: 10.5mm; margin-top: 3mm; opacity: 0.9; }

  .lista { display: grid; grid-template-columns: 1fr 1fr; grid-auto-rows: 1fr; gap: 12mm; padding: 0 30mm; }
  .combo {
    position: relative; box-sizing: border-box; background: var(--tarjeta); border: 0.8mm solid var(--borde-tarjeta); border-radius: 8mm;
    display: grid; grid-template-rows: 1fr auto; row-gap: 5mm; padding: 10mm 11mm 10mm;
  }
  .combo .numero {
    position: absolute; top: 7mm; left: 7mm; z-index: 2;
    width: 31mm; height: 31mm; border-radius: 50%; background: var(--acento); color: var(--sobre-acento);
    display: grid; place-content: center; place-items: center; font-family: "Archivo Black"; font-size: 15mm; line-height: 1;
  }
  .combo .numero small { font-size: 4.8mm; letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: -1.5mm; }

  /* Los productos, juntos como en un anuncio: cada foto recortada al producto, a la misma altura, y el «+» entre los dos. */
  .combo .fotos { display: flex; justify-content: center; align-items: flex-end; gap: 1mm; min-height: 0; padding: 4mm 0 0; }
  .combo .fotos img { height: 92mm; width: auto; max-width: 112mm; object-fit: contain; display: block; }
  .combo .fotos .mas {
    align-self: center; flex: none; z-index: 1; margin: 0 -4mm;
    width: 13mm; height: 13mm; border-radius: 50%; background: var(--acento); color: var(--sobre-acento);
    display: grid; place-items: center; font-family: "Archivo Black"; font-size: 10mm; line-height: 1;
  }
  /* Mientras falte la foto de un producto, un hueco que lo dice. */
  .combo .fotos .falta {
    box-sizing: border-box; width: 46mm; height: 92mm; border: 0.8mm dashed var(--tinta-suave); border-radius: 4mm;
    display: grid; place-items: center; text-align: center; font-size: 6mm; color: var(--tinta-suave); padding: 4mm; opacity: 0.7;
  }

  .combo .pie { display: grid; grid-template-columns: 1fr auto; align-items: end; column-gap: 8mm; }
  .combo .que { display: grid; gap: 1.5mm; min-width: 0; }
  .combo .producto { font-family: "Archivo Black"; font-size: 10.5mm; line-height: 1.05; text-transform: uppercase; }
  .combo .detalle { font-size: 7mm; color: var(--tinta-suave); margin-top: 1.5mm; }
  /* La casilla del precio va en blanco: se escribe con marcador y se cambia cuando cambia la tasa. */
  .combo .precio {
    box-sizing: border-box; width: 84mm; height: 32mm; border: 1.3mm solid var(--acento); border-radius: 3.5mm; background: #fff;
    display: flex; align-items: center; padding: 0 5mm; gap: 3mm;
  }
  .combo .precio .bs { font-family: "Archivo Black"; font-size: 10mm; color: var(--acento); line-height: 1; }

  .pie-cartel { display: grid; grid-template-columns: 1fr auto; align-items: end; gap: 10mm; padding: 0 30mm; color: var(--pie); }
  .pie-cartel .donde { font-size: 10mm; line-height: 1.35; }
  .pie-cartel strong { font-family: "Archivo Black"; color: var(--pie-fuerte); }
  .pie-cartel .pagos { font-size: 9mm; text-align: right; line-height: 1.4; opacity: 0.9; }
</style>
</head>
<body>

<template id="tarjetas">
  <article class="combo">
    <div class="numero"><small>Combo</small>1</div>
    <div class="fotos"><img src="fotos/jamon-de-espalda.png" alt=""><span class="mas">+</span><img src="fotos/queso-amarillo.png" alt=""></div>
    <div class="pie">
      <div class="que"><div class="producto">Jamón de espalda</div><div class="producto">Queso amarillo</div><div class="detalle">Bandeja de 400 g</div></div>
      <div class="precio"><span class="bs">Bs</span></div>
    </div>
  </article>

  <article class="combo">
    <div class="numero"><small>Combo</small>2</div>
    <div class="fotos"><img src="fotos/jamon-arepero.png" alt=""><span class="mas">+</span><img src="fotos/mozzarella.png" alt=""></div>
    <div class="pie">
      <div class="que"><div class="producto">Jamón arepero</div><div class="producto">Mozzarella</div><div class="detalle">Bandeja de 400 g</div></div>
      <div class="precio"><span class="bs">Bs</span></div>
    </div>
  </article>

  <article class="combo">
    <div class="numero"><small>Combo</small>3</div>
    <div class="fotos"><span class="falta">Falta la foto de la mortadela</span><span class="mas">+</span><img src="fotos/queso-amarillo.png" alt=""></div>
    <div class="pie">
      <div class="que"><div class="producto">Mortadela de pollo</div><div class="producto">Queso amarillo</div><div class="detalle">Bandeja de 400 g</div></div>
      <div class="precio"><span class="bs">Bs</span></div>
    </div>
  </article>

  <article class="combo">
    <div class="numero"><small>Combo</small>4</div>
    <div class="fotos"><img src="fotos/queso-amarillo.png" alt=""><span class="mas">+</span><img src="fotos/jamon-arepero.png" alt=""></div>
    <div class="pie">
      <div class="que"><div class="producto">Queso amarillo</div><div class="producto">Jamón arepero</div><div class="detalle">Bandeja de 400 g</div></div>
      <div class="precio"><span class="bs">Bs</span></div>
    </div>
  </article>

  <article class="combo">
    <div class="numero"><small>Combo</small>6</div>
    <div class="fotos"><span class="falta">Falta la foto de la boloña</span><span class="mas">+</span><span class="falta">Falta la foto del suero</span></div>
    <div class="pie">
      <div class="que"><div class="producto">Boloña de pollo</div><div class="producto">Suero San Pedro</div><div class="detalle">200 g de boloña y 1 bolsa de suero</div></div>
      <div class="precio"><span class="bs">Bs</span></div>
    </div>
  </article>

  <article class="combo">
    <div class="numero"><small>Combo</small>7</div>
    <div class="fotos"><span class="falta">Falta la foto de la pechuga</span><span class="mas">+</span><img src="fotos/mozzarella.png" alt=""></div>
    <div class="pie">
      <div class="que"><div class="producto">Pechuga de pavo</div><div class="producto">Mozzarella</div><div class="detalle">Bandeja de 400 g</div></div>
      <div class="precio"><span class="bs">Bs</span></div>
    </div>
  </article>

  <article class="combo">
    <div class="numero"><small>Combo</small>8</div>
    <div class="fotos"><span class="falta">Falta la foto de la mortadela</span><span class="mas">+</span><span class="falta">Falta la foto de los huevos</span></div>
    <div class="pie">
      <div class="que"><div class="producto">Mortadela de pollo</div><div class="producto">6 huevos</div><div class="detalle">200 g de mortadela y media docena de huevos</div></div>
      <div class="precio"><span class="bs">Bs</span></div>
    </div>
  </article>

  <article class="combo">
    <div class="numero"><small>Combo</small>9</div>
    <div class="fotos"><span class="falta">Falta la foto del jamón ahumado</span><span class="mas">+</span><img src="fotos/mozzarella.png" alt=""></div>
    <div class="pie">
      <div class="que"><div class="producto">Jamón ahumado</div><div class="producto">Mozzarella</div><div class="detalle">Bandeja de 400 g</div></div>
      <div class="precio"><span class="bs">Bs</span></div>
    </div>
  </article>
</template>

<template id="cartel">
  <div class="cartel">
    <header class="cabecera">
      <img src="../public/marca/leon.svg" alt="">
      <div class="marca">
        <div class="charcuteria">Charcutería</div>
        <div class="nombre">Villa Real</div>
        <div class="combos">Combos</div>
        <div class="lema">Bandejas listas para la arepa, el sándwich y la pizza</div>
      </div>
    </header>
    <section class="lista"></section>
    <footer class="pie-cartel">
      <div class="donde"><strong>Calle 38 entre carreras 30 y 31</strong>, sector Centro · Barquisimeto<br>WhatsApp <strong>0424-6343236</strong></div>
      <div class="pagos">Pago móvil · Efectivo · Zelle<br>Al mayor y al detal</div>
    </footer>
  </div>
</template>

<script>
  // El mismo cartel en cada color: las tarjetas se escriben una sola vez, arriba.
  for (const tema of ["rojo", "negro"]) {
    const cartel = document.getElementById("cartel").content.firstElementChild.cloneNode(true);
    cartel.classList.add("cartel--" + tema);
    cartel.dataset.archivo = "combos-" + tema + "-60x90";
    cartel.querySelector(".lista").append(document.getElementById("tarjetas").content.cloneNode(true));
    document.body.append(cartel);
  }
</script>
</body>
</html>
